<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<style>/* ../core/core.css */
/* Structural base shared by every design. Designs set the tokens; nothing here picks a "look".
   Muse plumbing: --header-height (Muse's overlay header), --bottom-padding (+ safe area) are set by the host. */
:root {
  --cf-top: var(--header-height, 0px);
  --cf-bottom: calc(var(--bottom-padding, 0px) + env(safe-area-inset-bottom, 0px));
  --cf-ease: cubic-bezier(.2, .9, .25, 1);
  --cf-ease-out: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light dark;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); overscroll-behavior-y: none; }
html.cf-locked { overflow: hidden; }
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 2px; }
.num, .cf-sk-val, .cf-sk-cval, .cf-total strong, .cf-step-val { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
[hidden] { display: none !important; }

/* ---------- Sankey ---------- */
.cf-sk { display: block; overflow: visible; }
.cf-sk text { fill: var(--text); }
.cf-sk-name { font: 600 12.5px/1 var(--font); letter-spacing: -.005em; }
.cf-sk-val { font: 500 12px/1 var(--font-num, var(--font)); fill: var(--dim) !important; }
.cf-sk-cname { font: 600 11px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; fill: var(--dim) !important; }
.cf-sk-cval { font: 700 15px/1 var(--font-num, var(--font)); }
.cf-sk-delta.up { fill: var(--pos) !important; } .cf-sk-delta.down { fill: var(--neg) !important; }
.cf-sk-sub { fill: var(--dim) !important; opacity: .8; }
.cf-sk-leader { stroke: var(--border); stroke-width: 1; }
.cf-sk-label.is-deficit .cf-sk-name { fill: var(--neg); }
.cf-sk-flow, .cf-sk-node, .cf-sk-label { transition: opacity .25s ease; }
.cf-sk-flow { cursor: pointer; }
.cf-sk-flow.is-pending { stroke: var(--dim); stroke-dasharray: 3 4; stroke-width: 1; }
.cf-sk-node.is-deficit { opacity: .85; }
.cf-sk.has-sel .cf-sk-flow:not(.on) { opacity: .14; }
.cf-sk.has-sel .cf-sk-label:not(.on), .cf-sk.has-sel .cf-sk-node:not(.on):not(.is-center) { opacity: .35; }
.cf-sk.cf-enter .cf-sk-flows { animation: cf-reveal .9s var(--cf-ease-out) both; }
.cf-sk.cf-enter .cf-sk-labels { animation: cf-fade .5s .35s ease both; }
@keyframes cf-reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes cf-fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Bars / YoY ---------- */
.cf-bars, .cf-yoy, .cf-pairs { display: block; overflow: visible; }
.cf-base { stroke: var(--border); stroke-width: 1; }
.cf-grid { stroke: var(--border); stroke-dasharray: 2 4; }
.cf-blab { font: 500 10.5px/1 var(--font); fill: var(--dim); }
.cf-bar { cursor: pointer; transition: opacity .2s; }
.cf-bars:has(.is-sel) .cf-bar:not(.is-sel) .cf-up, .cf-bars:has(.is-sel) .cf-bar:not(.is-sel) .cf-down { opacity: .45; }
.cf-bar.is-sel .cf-blab { fill: var(--text); font-weight: 700; }
.cf-bar.is-sample .cf-up, .cf-bar.is-sample .cf-down { opacity: .5; }
.cf-bars:has(.is-sel) .cf-bar.is-sample.is-sel .cf-up { opacity: .7; }
.cf-net { fill: var(--bg); stroke: var(--text); stroke-width: 1.6; }
.cf-net.neg { stroke: var(--neg); }
.cf-bars.cf-enter .cf-up, .cf-bars.cf-enter .cf-down { transform-box: fill-box; animation: cf-grow .6s var(--cf-ease-out) both; animation-delay: calc(var(--i) * 28ms); }
.cf-bars.cf-enter .cf-up { transform-origin: bottom; } .cf-bars.cf-enter .cf-down { transform-origin: top; }
@keyframes cf-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.cf-yoy-cur { stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cf-yoy-prev { stroke: var(--dim); stroke-width: 1.6; stroke-dasharray: 4 4; opacity: .7; }
.cf-yoy-end { font: 700 12px/1 var(--font-num, var(--font)); fill: var(--text); }
.cf-yoy-end.prev, .cf-yoy-endt { fill: var(--dim); font: 500 10px/1 var(--font); }
.cf-yoy-end.prev { font-weight: 600; font-size: 11px; }
.cf-blab.is-now { fill: var(--text); font-weight: 700; }
.cf-bval { font: 700 11px/1 var(--font-num, var(--font)); fill: var(--text); }
.cf-yoy.cf-enter .cf-yoy-cur { stroke-dasharray: 2000; animation: cf-draw 1.1s var(--cf-ease-out) both; }
@keyframes cf-draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
.cf-p-prev { fill: var(--dim); opacity: .35; } .cf-p-cur { fill: var(--accent); }
.cf-pairs.cf-enter rect:not(.cf-hit) { transform-box: fill-box; transform-origin: bottom; animation: cf-grow .55s var(--cf-ease-out) both; animation-delay: calc(var(--i) * 25ms); }
.cf-ring-val { transition: stroke-dasharray .8s var(--cf-ease-out); }

/* ---------- Calendar ---------- */
.cf-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--cal-gap, 4px); }
.cf-cal-dow { font: 600 10.5px/1 var(--font); color: var(--dim); text-align: center; padding: 4px 0 6px; letter-spacing: .04em; }
.cf-cal-day { position: relative; aspect-ratio: 1 / 1.05; min-height: 40px; border: 0; border-radius: var(--cal-radius, 10px); background: var(--surface-2); padding: 5px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; transition: transform .12s ease, background .2s; }
.cf-cal-day:active { transform: scale(.94); }
.cf-cal-day.is-we { background: transparent; }
.cf-cal-day.is-future { opacity: .55; }
.cf-cal-day.is-today { box-shadow: inset 0 0 0 1.5px var(--text); }
.cf-cal-num { font: 600 11.5px/1 var(--font-num, var(--font)); }

/* ---------- Sheets ---------- */
.cf-sheet-root { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.cf-sheet-root.is-open, .cf-sheet-root.is-closing { pointer-events: auto; }
.cf-scrim { position: absolute; inset: 0; background: var(--scrim, rgba(10, 10, 12, .42)); opacity: 0; transition: opacity .28s ease; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.cf-sheet-root.is-open .cf-scrim { opacity: 1; }
.cf-sheet { position: absolute; display: flex; flex-direction: column; background: var(--sheet-bg, var(--surface)); color: var(--text); box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); outline: none; transition: transform .34s var(--cf-ease), opacity .25s ease; }
.cf-sheet.is-bottom { left: 0; right: 0; bottom: 0; max-height: calc(100dvh - var(--cf-top) - 28px); border-radius: var(--sheet-radius, 22px) var(--sheet-radius, 22px) 0 0; transform: translate3d(0, 105%, 0); padding-bottom: var(--cf-bottom); }
.cf-sheet.is-drawer { top: calc(var(--cf-top) + 12px); right: 12px; bottom: 12px; width: min(460px, calc(100vw - 24px)); border-radius: var(--sheet-radius, 18px); transform: translate3d(calc(100% + 24px), 0, 0); }
.cf-sheet.is-modal { left: 50%; top: 50%; width: min(520px, calc(100vw - 32px)); max-height: min(720px, calc(100dvh - var(--cf-top) - 48px)); border-radius: var(--sheet-radius, 18px); transform: translate3d(-50%, -46%, 0) scale(.97); opacity: 0; }
.cf-sheet-root.is-open .cf-sheet.is-bottom, .cf-sheet-root.is-open .cf-sheet.is-drawer { transform: none; }
.cf-sheet-root.is-open .cf-sheet.is-modal { transform: translate3d(-50%, -50%, 0); opacity: 1; }
.cf-grab { display: none; }
.cf-sheet.is-bottom .cf-grab { display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 0; flex: none; }
.cf-sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px 10px; flex: none; touch-action: none; }
.cf-sheet-titles { flex: 1; min-width: 0; }
.cf-sheet-title { margin: 0; font: 700 19px/1.2 var(--font-display, var(--font)); letter-spacing: -.01em; }
.cf-sheet-sub { margin: 3px 0 0; color: var(--dim); font-size: 13px; }
.cf-sheet-x { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--dim); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.cf-sheet-body { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px 18px 18px; -webkit-overflow-scrolling: touch; }
.cf-sheet-foot { flex: none; display: flex; gap: 10px; align-items: center; padding: 12px 18px 14px; border-top: 1px solid var(--border); }
.cf-grow { flex: 1; }
@media (prefers-reduced-motion: reduce) { .cf-sheet, .cf-scrim { transition: none !important; } *, *::before { animation-duration: .01ms !important; } }

/* ---------- Forms ---------- */
.cf-form { display: flex; flex-direction: column; gap: 14px; }
.cf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cf-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cf-label { font: 600 12px/1.2 var(--font); color: var(--dim); letter-spacing: .01em; }
.cf-hint { font-size: 11.5px; color: var(--dim); opacity: .85; }
.cf-input { width: 100%; min-height: 44px; font: 500 16px/1.2 var(--font); color: var(--text); background: var(--input-bg, var(--surface-2)); border: 1px solid var(--input-border, transparent); border-radius: var(--input-radius, 12px); padding: 10px 12px; -webkit-appearance: none; appearance: none; }
.cf-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.cf-input:disabled { opacity: .6; }
select.cf-input { background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.cf-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px; scroll-snap-type: x proximity; }
.cf-chips::-webkit-scrollbar { display: none; }
.cf-chip { flex: none; scroll-snap-align: start; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; border: 1px solid var(--border); background: transparent; border-radius: 12px; padding: 9px 12px; transition: transform .12s, background .2s; }
.cf-chip:active { transform: scale(.96); background: var(--surface-2); }
.cf-chip strong { font-size: 13.5px; } .cf-chip span { font-size: 11.5px; color: var(--dim); }
.cf-stepper { display: flex; align-items: center; min-height: 44px; background: var(--input-bg, var(--surface-2)); border-radius: var(--input-radius, 12px); padding: 3px; border: 1px solid var(--input-border, transparent); }
.cf-step { width: 38px; height: 38px; border: 0; border-radius: 9px; background: var(--surface); font-size: 18px; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.cf-step:active { transform: scale(.92); }
.cf-step-val { flex: 1; text-align: center; font-weight: 600; font-size: 14.5px; }
.cf-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--dim); font-size: 13.5px; }
.cf-total strong { color: var(--text); font-size: 20px; letter-spacing: -.01em; }
.cf-error { margin: 0; color: var(--neg); font-size: 13.5px; font-weight: 500; }
.cf-note { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.45; }
.cf-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cf-seg-btn { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left; border: 1px solid var(--border); background: transparent; border-radius: 12px; padding: 10px 12px; }
.cf-seg-btn strong { font-size: 13.5px; } .cf-seg-btn span { font-size: 11.5px; color: var(--dim); }
.cf-seg-btn[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cf-btn { min-height: 44px; padding: 0 18px; border-radius: var(--btn-radius, 12px); border: 1px solid var(--border); background: transparent; font-weight: 600; font-size: 15px; transition: transform .12s, opacity .2s; }
.cf-btn:active { transform: scale(.97); }
.cf-btn.is-primary { background: var(--accent); color: var(--accent-text, #fff); border-color: transparent; }
.cf-btn.is-danger { color: var(--neg); border-color: transparent; padding: 0 6px; }
.cf-btn:disabled { opacity: .6; }
@media (max-width: 380px) { .cf-row { grid-template-columns: 1fr; } }

/* ---------- Toast + prototype bar ---------- */
.cf-toast { position: fixed; left: 50%; bottom: calc(var(--cf-bottom) + var(--toast-offset, 20px)); transform: translate(-50%, 20px); opacity: 0; z-index: 200; display: flex; gap: 12px; align-items: center; background: var(--toast-bg, #1d1d20); color: var(--toast-text, #fff); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: transform .3s var(--cf-ease), opacity .25s; pointer-events: none; max-width: calc(100vw - 32px); }
.cf-toast.is-on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.cf-toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; }
.cf-devbar { display: inline-flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; background: var(--surface-2); font-size: 12px; }
.cf-dev-tag { padding: 0 8px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; color: var(--dim); }
.cf-dev-btn { border: 0; background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; color: var(--dim); }
.cf-dev-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); }

/* ---------- Swipe-to-reveal rows ---------- */
.cf-sr { position: relative; overflow: hidden; isolation: isolate; }
.cf-sr-acts { position: absolute; inset: 0 0 0 auto; display: flex; z-index: 0; }
.cf-sr-act { border: 0; min-width: 84px; padding: 0 14px; font: 600 14px/1.1 var(--font); color: #fff; background: var(--dim); }
.cf-sr-act.is-danger { background: var(--neg); }
.cf-sr-act.is-alt { background: var(--accent); color: var(--accent-text, #fff); }
.cf-sr-main { position: relative; z-index: 1; will-change: transform; }
.cf-sr:not(.is-open) .cf-sr-acts { visibility: hidden; transition: visibility 0s .38s; }

/* ---------- Pull to refresh ---------- */
.cf-pull { position: fixed; left: 50%; top: calc(var(--cf-top) + 8px); z-index: 90; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--surface); color: var(--text); box-shadow: 0 6px 20px rgba(0, 0, 0, .14); font: 600 13px/1 var(--font); opacity: 0; pointer-events: none; transform: translate3d(-50%, -56px, 0); transition: transform .32s var(--cf-ease), opacity .2s; }
.cf-pull-ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--text); transform: rotate(calc(var(--p, 0) * 300deg)); }
.cf-pull.is-busy .cf-pull-ring { animation: cf-spin .8s linear infinite; }
@keyframes cf-spin { to { transform: rotate(360deg); } }
</style>
<style>/* style.css */
/* Pocket — Apple's Liquid Glass (iOS 26, as refined in iOS 27).
   Two layers. The content layer is plain grouped iOS: flat cards on a grey canvas, system colours for the income streams.
   The functional layer floats above it on glass. Phone: a big title that tightens on scroll, a glass tab bar at the bottom
   (its selection lifts into a lens when pressed) with a round + beside it, and pull-down to sync. Laptop: one top bar with
   the name, the tabs centred (the iPadOS pattern) and sync + add in a glass capsule. Menus grow out of the + button;
   sheets float inset from the edges.
   Glass recipe: translucent fill + blur/saturate, a darker outer edge, an inner light edge and a specular rim (iOS 27).
   Muse plumbing (core.css): --cf-top clears Muse's header, --cf-bottom clears its bottom chrome + the home indicator. */

/* ---------------- Tokens ---------------- */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .2);
  --text: #000000;
  --dim: #6e6e73;
  --border: rgba(60, 60, 67, .14);
  --hair: rgba(60, 60, 67, .17);
  --tint: #0088ff;
  --accent: var(--tint);
  --accent-text: #ffffff;
  --focus: #0088ff;
  --pos: #248a3d;
  --neg: #e0242a;
  --warn: #c46a00;
  --scrim: rgba(0, 0, 0, .2);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-num: var(--font-display);
  --cf-ease: cubic-bezier(.32, .72, 0, 1);
  --cf-ease-out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);
  --spring-pop: cubic-bezier(.3, 1.3, .45, 1);

  /* streams: Apple system colours (iOS 26 palette) */
  --s-job: #ff383c; --on-job: #ffffff;
  --s-gig: #0088ff; --on-gig: #ffffff;
  --s-hourly: #6155f5; --on-hourly: #ffffff;
  --s-lumpsum: #ff8d28; --on-lumpsum: #ffffff;
  --s-dividends: #34c759; --on-dividends: #ffffff;
  --s-custom: #ff2d55; --on-custom: #ffffff;
  --sk-deficit: #ff383c;
  --sk-save: #34c759;
  --cat-1: #ff8d28; --cat-2: #00c0e8; --cat-3: #ff2d55; --cat-4: #ffcc00; --cat-5: #cb30e0; --cat-6: #8e8e93;
  --invest: #00c3d0;
  --spent-bar: #d1d1d6;
  --line-in: #34c759;
  --line-out: #ff383c;

  /* Liquid Glass */
  --g-bg: rgba(255, 255, 255, .66);
  --g-bg-strong: rgba(250, 250, 252, .8);
  --g-blur: 14px;
  --g-sat: 190%;
  --g-edge: 0 0 0 .5px rgba(0, 0, 0, .08);
  --g-inner: inset 0 1px 1.5px rgba(255, 255, 255, .8), inset 0 -1px 1px rgba(0, 0, 0, .03);
  --g-shadow: 0 8px 26px -6px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .05);
  --g-rim: linear-gradient(135deg, rgba(255, 255, 255, .98) 0%, rgba(255, 255, 255, .25) 30%, rgba(255, 255, 255, .06) 55%, rgba(255, 255, 255, .5) 100%);
  --g-sel: rgba(0, 0, 0, .07);
  --lens-bg: rgba(255, 255, 255, .34);
  --lens-sh: inset 0 0 0 1px rgba(255, 255, 255, .85), inset 0 1.5px 2px rgba(255, 255, 255, .9), inset 0 -2px 6px rgba(0, 0, 0, .06), 0 6px 18px -4px rgba(0, 0, 0, .18);
  --prominent: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 55%), var(--tint);
  --prominent-sh: inset 0 1px 1px rgba(255, 255, 255, .4), inset 0 -1px 1px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 40, 90, .12), 0 6px 16px -6px rgba(0, 136, 255, .55);

  --sheet-bg: var(--g-bg-strong);
  --sheet-radius: 34px;
  --input-bg: var(--fill);
  --input-border: transparent;
  --input-radius: 12px;
  --btn-radius: 999px;
  --cal-gap: 5px;
  --cal-radius: 10px;
  --toast-offset: 82px;

  /* hero: a plain card, same surface as the rest; colour comes only from the stream bar and dots */
  --hero-bg: var(--surface);
  --hero-text: var(--text);
  --hero-dim: var(--dim);
  --hero-pos: var(--pos);
  --hero-neg: var(--neg);
  --hero-track: rgba(120, 120, 128, .14);
  --hero-line: var(--hair);
  --hero-btn: var(--fill);

  --side-bg: rgba(246, 246, 249, .78);
  --seg-thumb: #ffffff;
  --seg-sh: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .04), 0 0 0 .5px rgba(0, 0, 0, .04);
  --r-card: 26px;
}
:root[data-scheme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --fill: rgba(120, 120, 128, .24);
  --fill-2: rgba(120, 120, 128, .34);
  --text: #ffffff;
  --dim: #98989f;
  --border: rgba(255, 255, 255, .1);
  --hair: rgba(255, 255, 255, .1);
  --tint: #0091ff;
  --focus: #0091ff;
  --pos: #30d158;
  --neg: #ff6961;
  --warn: #ffb340;
  --scrim: rgba(0, 0, 0, .45);
  --s-job: #ff4245; --s-gig: #0091ff; --s-hourly: #6b5dff; --s-lumpsum: #ff9230; --s-dividends: #30d158; --s-custom: #ff375f;
  --sk-deficit: #ff4245;
  --sk-save: #30d158;
  --cat-1: #ff9230; --cat-2: #3cd3fe; --cat-3: #ff375f; --cat-4: #ffd600; --cat-5: #db34f2; --cat-6: #98989d;
  --invest: #00d2e0;
  --spent-bar: #3a3a3c;
  --line-in: #30d158;
  --line-out: #ff4245;

  --g-bg: rgba(44, 44, 48, .56);
  --g-bg-strong: rgba(30, 30, 33, .82);
  --g-edge: 0 0 0 .5px rgba(0, 0, 0, .7);
  --g-inner: inset 0 1px 1px rgba(255, 255, 255, .14), inset 0 -1px 1px rgba(0, 0, 0, .25);
  --g-shadow: 0 10px 30px -6px rgba(0, 0, 0, .7), 0 1px 3px rgba(0, 0, 0, .4);
  --g-rim: linear-gradient(135deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .1) 30%, rgba(255, 255, 255, .03) 55%, rgba(255, 255, 255, .22) 100%);
  --g-sel: rgba(255, 255, 255, .12);
  --lens-bg: rgba(255, 255, 255, .1);
  --lens-sh: inset 0 0 0 1px rgba(255, 255, 255, .32), inset 0 1.5px 2px rgba(255, 255, 255, .3), 0 8px 22px -4px rgba(0, 0, 0, .6);
  --prominent-sh: inset 0 1px 1px rgba(255, 255, 255, .32), inset 0 -1px 1px rgba(0, 0, 0, .2), 0 0 0 .5px rgba(0, 0, 0, .5), 0 6px 18px -6px rgba(0, 145, 255, .5);

  --hero-bg: var(--surface);
  --hero-track: rgba(255, 255, 255, .1);
  --hero-btn: rgba(255, 255, 255, .1);
  --side-bg: rgba(28, 28, 30, .8);
  --seg-thumb: #636366;
  --seg-sh: 0 3px 8px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(255, 255, 255, .06);
}

/* ---------------- Base ---------------- */
html { background: var(--bg); }
body { font-size: 15px; line-height: 1.4; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
.pk-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pk-ic { display: inline-grid; place-items: center; flex: none; }
.pk-ic svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.pk-grow { flex: 1; }
.pk-app { padding-top: var(--cf-top); min-height: 100dvh; }
.pk-view { padding: 0 16px calc(var(--cf-bottom) + 108px); }
.pk-note { margin: 6px 0 0; font-size: 13px; line-height: 1.45; letter-spacing: -.005em; color: var(--dim); }
.pk-note strong { color: var(--text); font-weight: 600; }
.is-good { color: var(--pos); } .is-bad { color: var(--neg); }
::selection { background: color-mix(in srgb, var(--tint) 26%, transparent); }

/* ---------------- Liquid Glass: one material for every floating control ---------------- */
.pk-tabs, .pk-dock .pk-act.is-add, .pk-menu, .cf-sheet, .cf-toast, .cf-pull {
  background: var(--g-bg);
  -webkit-backdrop-filter: blur(var(--g-blur)) saturate(var(--g-sat));
  backdrop-filter: blur(var(--g-blur)) saturate(var(--g-sat));
  box-shadow: var(--g-edge), var(--g-inner), var(--g-shadow);
}
/* larger glass reads thicker (more opaque) so text on it stays legible */
.pk-menu, .cf-sheet, .cf-toast { background: var(--g-bg-strong); --g-blur: 28px; }
/* specular rim: light catching the top-left edge, a faint return on the bottom-right */
.pk-tabs::before, .pk-dock .pk-act.is-add::before, .pk-menu::before, .cf-sheet::before, .cf-toast::before {
  content: ''; position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1px; pointer-events: none;
  background: var(--g-rim);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}

/* ---------------- Header ----------------
   Phone: only the big title, which tightens as content scrolls under it (nothing floats at the top).
   Laptop: the name, the tabs and the actions share one bar. */
.pk-top { position: sticky; top: var(--cf-top); z-index: 40; display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 20px; }
.pk-lt { flex: 1; min-width: 0; margin: 0; font: 700 34px/1.1 var(--font-display); letter-spacing: -.022em; white-space: nowrap; transform-origin: left center; transition: transform .45s var(--spring); }
.is-scrolled .pk-lt { transform: scale(.62); }
.pk-tabslot, .pk-actions, .pk-act-l { display: none; }
.pk-act { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text); transition: background-color .15s, scale .3s var(--spring-pop); }
.pk-act:active, .pk-act.is-morphing { background: var(--g-sel); }
.pk-act:active { scale: .92; }
.pk-sync .pk-dot { position: absolute; top: 10px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.pk-sync.is-ok .pk-dot { background: var(--s-dividends); }
.pk-sync.is-bad .pk-dot { background: var(--neg); }
.pk-sync.is-busy .pk-dot { background: var(--warn); }
.pk-sync.is-busy .pk-ic { animation: pk-spin 1s linear infinite; }
@keyframes pk-spin { to { transform: rotate(360deg); } }

/* scroll edge effect: a soft progressive blur where content meets floating controls (no hard bars) */
.pk-edge { position: fixed; left: 0; right: 0; pointer-events: none; }
.pk-edge.is-top {
  top: 0; z-index: 35; height: calc(var(--cf-top) + 76px); opacity: 0; transition: opacity .25s;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 82%, transparent) 0%, color-mix(in srgb, var(--bg) 46%, transparent) 62%, transparent 100%);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent); mask-image: linear-gradient(to bottom, #000 58%, transparent);
}
.is-scrolled .pk-edge.is-top { opacity: 1; }
.pk-edge.is-bottom {
  bottom: 0; z-index: 45; height: calc(var(--cf-bottom) + 92px);
  background: linear-gradient(to top, color-mix(in srgb, var(--bg) 72%, transparent) 0%, transparent 100%);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  -webkit-mask-image: linear-gradient(to top, #000 40%, transparent); mask-image: linear-gradient(to top, #000 40%, transparent);
}

/* ---------------- Tab bar (phone): one glass capsule for navigation, a round glass + beside it ---------------- */
.pk-dock { position: fixed; z-index: 50; left: 16px; right: 16px; bottom: calc(var(--cf-bottom) + 8px); height: 62px; pointer-events: none; }
.pk-dock .pk-act.is-add { position: absolute; right: 0; bottom: 0; width: 62px; height: 62px; pointer-events: auto; }
.pk-dock .pk-act.is-add:active { scale: .9; }
.pk-tabs {
  position: absolute; left: 0; right: 72px; bottom: 0; height: 62px; padding: 4px; border-radius: 31px;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); pointer-events: auto; touch-action: none;
}
.pk-tab-ind {
  position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 4); border-radius: 27px;
  background: var(--g-sel); transform: translateX(calc(var(--ti, 0) * 100%));
  transition: transform .55s var(--spring), scale .35s var(--spring-pop), background-color .2s, box-shadow .25s, opacity .2s;
}
.pk-tabs.is-press .pk-tab-ind { scale: 1.12 1.2; background: var(--lens-bg); box-shadow: var(--lens-sh); }
.pk-tabs.is-drag .pk-tab-ind { transform: translateX(var(--lx)); transition: scale .35s var(--spring-pop), background-color .2s, box-shadow .25s; }
.pk-tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; border: 0; border-radius: 27px; background: transparent; color: var(--text); transition: color .2s, opacity .2s; }
.pk-tab.is-on, .pk-tab.is-lens { color: var(--tint); }
.pk-tabs.is-drag .pk-tab.is-on:not(.is-lens) { color: var(--text); }
.pk-nav-ic { display: grid; place-items: center; height: 28px; }
.pk-nav-ic .pk-ic { transition: scale .35s var(--spring-pop); }
.pk-ic-on { display: none !important; }
.is-on > .pk-nav-ic .pk-ic-on { display: grid !important; }
.is-on > .pk-nav-ic .pk-ic-off { display: none !important; }
.pk-tab.is-lens .pk-nav-ic .pk-ic, .pk-tabs.is-press:not(.is-drag) .pk-tab:active .pk-nav-ic .pk-ic { scale: 1.12; }
.pk-nav-l { font: 600 10.5px/1 var(--font); letter-spacing: 0; }

/* sync status dots (timesheet card) */
.pk-syncline i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
.is-ok > i { background: var(--s-dividends); }
.is-bad > i { background: var(--neg); }
.is-busy > i { background: var(--warn); animation: pk-blink 1s ease-in-out infinite alternate; }
@keyframes pk-blink { to { opacity: .3; } }
.pk-brand { display: flex; align-items: center; gap: 9px; font: 700 18px/1 var(--font-display); letter-spacing: -.02em; white-space: nowrap; }

/* ---------------- Add menu: grows out of the + button ---------------- */
.pk-menu-root { position: fixed; inset: 0; z-index: 120; }
.pk-menu-catch { position: absolute; inset: 0; }
.pk-menu {
  position: absolute; width: min(300px, calc(100vw - 32px)); overflow: auto; overscroll-behavior: contain; padding: 6px 0; border-radius: 26px;
  opacity: 0; transform: scale(.18); transition: transform .42s var(--spring-pop), opacity .18s;
}
.pk-menu-root.is-open .pk-menu { opacity: 1; transform: none; }
.pk-menu-root.is-closing .pk-menu { opacity: 0; transform: scale(.25); transition: transform .26s var(--spring), opacity .2s .04s; }
.pk-mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 8px 18px 8px 20px; border: 0; background: transparent; color: var(--text); text-align: left; transition: background-color .12s; }
.pk-mi:active, .pk-mi:focus-visible { background: var(--g-sel); outline: none; }
.pk-mi-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pk-mi-t strong { font: 500 16px/1.2 var(--font); letter-spacing: -.015em; }
.pk-mi-t span { font-size: 12.5px; color: var(--dim); }
.pk-mi-ic { color: var(--sc); }
.pk-mi-sep { height: 6px; margin: 4px 0; background: var(--fill); opacity: .6; }

/* ---------------- Motion ---------------- */
.pk-view.is-enter > * > * { animation: pk-rise .55s var(--cf-ease-out) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
.pk-view.is-enter > * > *:nth-child(2) { --i: 1; } .pk-view.is-enter > * > *:nth-child(3) { --i: 2; } .pk-view.is-enter > * > *:nth-child(4) { --i: 3; } .pk-view.is-enter > * > *:nth-child(n+5) { --i: 4; }
@keyframes pk-rise { from { opacity: 0; transform: translate3d(0, 10px, 0); } }
.enter-next { animation: pk-from-r .45s var(--cf-ease-out) both; }
.enter-prev { animation: pk-from-l .45s var(--cf-ease-out) both; }
@keyframes pk-from-r { from { opacity: 0; transform: translate3d(24px, 0, 0); } }
@keyframes pk-from-l { from { opacity: 0; transform: translate3d(-24px, 0, 0); } }
@keyframes pk-grow-x { from { transform: scaleX(0); } }

/* ---------------- Layout + type (content layer: plain grouped iOS) ---------------- */
.pk-home, .pk-grid2, .pk-col, .pk-work, .pk-money, .pk-more { display: flex; flex-direction: column; gap: 14px; }
.pk-sec { display: flex; flex-direction: column; margin-top: 16px; }
.pk-col > .pk-sec:first-child { margin-top: 0; }
.pk-sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 4px 10px; }
.pk-h2 { margin: 0; font: 700 22px/1.2 var(--font-display); letter-spacing: -.022em; }
.pk-h3 { margin: 0; font: 650 17px/1.25 var(--font-display); letter-spacing: -.02em; }
.pk-sec-sub { margin: 3px 0 0; font-size: 13px; letter-spacing: -.005em; color: var(--dim); }
.pk-k { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: -.005em; color: var(--dim); }

.pk-card { position: relative; padding: 16px; border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.pk-card.pk-list { padding: 0; }
.pk-card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.pk-card-sub { margin: 3px 0 0; font-size: 12.5px; color: var(--dim); }
.pk-empty { padding: 24px 18px; text-align: center; }
.pk-empty p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
.pk-empty .pk-btn { margin-top: 12px; }

/* blank slate: nothing set up yet */
.pk-home.is-blank { display: block; max-width: 560px; margin: 8px auto 0; }
.pk-welcome { padding: 28px 22px 22px; }
.pk-welcome-mark { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: color-mix(in srgb, var(--tint) 12%, transparent); color: var(--tint); }
.pk-welcome-t { margin: 18px 0 6px; font: 700 26px/1.15 var(--font-display); letter-spacing: -.03em; }
.pk-welcome-p { margin: 0; max-width: 44ch; color: var(--dim); font-size: 15px; line-height: 1.45; }
.pk-welcome .pk-btnrow { margin-top: 20px; }
.pk-welcome-demo { display: inline-block; margin-top: 14px; }
.pk-ask { display: block; width: 100%; resize: none; padding: 14px; border: 0; border-radius: 14px; background: var(--fill); color: var(--text); font: 400 15px/1.45 var(--font); }
.pk-ask:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
/* first-load placeholder: the layout's shape, no numbers */
.pk-skel { display: grid; gap: 14px; padding-top: 6px; }
.pk-skel-b { border-radius: var(--r-card); background: var(--surface); animation: pk-skel 1.6s ease-in-out infinite; }
.pk-skel-b.is-bar { width: min(100%, 420px); height: 36px; border-radius: 999px; background: var(--fill); }
.pk-skel-b.is-hero { height: 220px; }
.pk-skel-b.is-list { height: 180px; animation-delay: .2s; }
@keyframes pk-skel { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .pk-skel-b { animation: none; } }

/* buttons: tinted prominent glass for the one main action, plain fills for the rest */
.pk-btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; font: 600 16px/1 var(--font); letter-spacing: -.015em; white-space: nowrap; transition: scale .3s var(--spring-pop), background-color .2s, opacity .2s, filter .2s; }
.pk-btn:active:not(:disabled) { scale: .96; }
.pk-btn:disabled { opacity: .38; cursor: default; }
.pk-btn.is-primary { background: var(--prominent); color: #fff; box-shadow: var(--prominent-sh); }
.pk-btn.is-secondary { background: var(--fill); color: var(--text); }
.pk-btn.is-ghost { background: transparent; color: var(--tint); padding: 0 12px; }
.pk-link { position: relative; border: 0; background: transparent; padding: 0; color: var(--tint); font: 600 14px/1.2 var(--font); letter-spacing: -.01em; white-space: nowrap; }
.pk-link::after { content: ''; position: absolute; inset: -10px -8px; }
.pk-card-h .pk-link, .pk-sec-h .pk-link, .pk-srow > .pk-link { padding: 8px 14px; border-radius: 999px; background: var(--fill); transition: scale .3s var(--spring-pop); }
.pk-card-h .pk-link:active, .pk-srow > .pk-link:active { scale: .94; }
.pk-badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: var(--fill); color: var(--dim); font: 600 12px/1 var(--font); white-space: nowrap; }
.pk-badge.is-live, .pk-badge.is-done { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
.pk-badge.is-break { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pk-badge.is-warn { background: color-mix(in srgb, var(--neg) 13%, transparent); color: var(--neg); }

/* period row: Month / Year + the month chips */
.pk-period { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pk-period > .pk-seg { flex: none; }
.pk-strip { display: flex; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
.pk-period > .pk-strip { flex: 1; min-width: 0; margin: 0 -16px 0 0; padding-left: 6px; }
.pk-strip::-webkit-scrollbar { display: none; }
.pk-chip { position: relative; flex: none; min-width: 50px; height: 36px; padding: 0 15px; border: 0; border-radius: 999px; background: var(--fill); color: var(--text); font: 500 15px/1 var(--font); letter-spacing: -.01em; transition: background-color .25s, color .25s, scale .3s var(--spring-pop); }
.pk-chip:active { scale: .93; }
.pk-chip.is-on { background: var(--text); color: var(--bg); font-weight: 600; }
.pk-chip.is-now:not(.is-on)::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--tint); }
.pk-chip.is-sample:not(.is-on) { color: var(--dim); }

/* segmented controls: capsule track, the thumb lifts into a lens while pressed */
.pk-seg, .pk-job { position: relative; display: grid; padding: 2px; border-radius: 999px; background: var(--fill); }
.pk-seg { grid-template-columns: 1fr 1fr; }
.pk-seg-btn { position: relative; z-index: 1; min-width: 64px; height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font: 600 14px/1 var(--font); letter-spacing: -.01em; color: var(--dim); transition: color .25s; }
.pk-seg-btn::after { content: ''; position: absolute; inset: -6px 0; }
.pk-seg-btn[aria-checked="true"] { color: var(--text); }
.pk-seg-thumb, .pk-job-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 999px; background: var(--seg-thumb); box-shadow: var(--seg-sh); transition: transform .5s var(--spring), scale .35s var(--spring-pop), background-color .2s, box-shadow .2s; }
.pk-seg-thumb { width: calc(50% - 2px); }
.pk-seg[data-mode="year"] .pk-seg-thumb { transform: translateX(100%); }
.pk-seg:active .pk-seg-thumb, .pk-job:active .pk-job-thumb { scale: 1.06 1.14; background: var(--lens-bg); box-shadow: var(--lens-sh); }

/* tiles: Settings-style, a white glyph on the stream's colour */
.pk-tile { --sc: #8e8e93; position: relative; width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 70%), var(--sc); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .06), inset 0 1px 0 rgba(255, 255, 255, .25); }
.pk-tile.is-job { --sc: var(--s-job); } .pk-tile.is-gig { --sc: var(--s-gig); } .pk-tile.is-hourly { --sc: var(--s-hourly); }
.pk-tile.is-lumpsum { --sc: var(--s-lumpsum); } .pk-tile.is-dividends { --sc: var(--s-dividends); } .pk-tile.is-custom { --sc: var(--s-custom); }
.pk-tile.is-bag { --sc: var(--cat-1); } .pk-tile.is-chart { --sc: var(--invest); } .pk-tile.is-user { --sc: #8e8e93; } .pk-tile.is-sliders { --sc: #636366; }
.pk-tile.is-new { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fill-2); color: var(--dim); }
.pk-dtile { width: 40px; height: 42px; flex: none; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--fill); }
.pk-dtile span { font: 600 9.5px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.pk-dtile strong { font: 600 17px/1 var(--font-num); letter-spacing: -.02em; }

/* ---------------- Rows ---------------- */
.pk-list { display: flex; flex-direction: column; }
.pk-list > * { position: relative; }
.pk-list > * + *::after { content: ''; position: absolute; z-index: 3; top: 0; left: 60px; right: 0; height: .5px; background: var(--hair); pointer-events: none; }
.pk-list.is-flush { margin: 0 -16px; }
.pk-list.is-flush:last-child { margin-bottom: -16px; }
.pk-card-h + .pk-list.is-flush { margin-top: -4px; }
.pk-list > .pk-lrow + .pk-lrow::after, .pk-list > .cf-sr + .cf-sr::after { left: 68px; }
.pk-srow, .pk-urow, .pk-lrow {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-auto-flow: column; grid-auto-columns: auto; align-items: center; gap: 12px;
  width: 100%; min-height: 60px; padding: 10px 16px 10px 16px; border: 0; background: var(--surface); color: var(--text); text-align: left;
  transition: background-color .15s;
}
.pk-srow:active:not(.is-static), .pk-urow:active, .pk-lrow:active { background: color-mix(in srgb, var(--surface) 88%, var(--text)); }
.pk-srow:focus-visible, .pk-urow:focus-visible, .pk-lrow:focus-visible { outline-offset: -3px; }
.pk-srow-main, .pk-lmain { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pk-srow-main strong, .pk-lmain strong { font-size: 16px; font-weight: 500; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-srow-main span, .pk-lmain span { font-size: 13px; letter-spacing: -.005em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-srow > .pk-ic, .pk-lrow > .pk-ic { color: var(--dim); opacity: .5; }
.pk-srow-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pk-srow-r strong { font: 600 16px/1 var(--font-num); letter-spacing: -.015em; }
.pk-srow.is-idle .pk-srow-main strong, .pk-srow.is-idle .pk-srow-r strong { color: var(--dim); }
.pk-srow.is-idle .pk-tile { background: var(--fill-2); box-shadow: none; color: var(--dim); }
.pk-chg { font: 600 11px/1 var(--font-num); padding: 3px 6px; border-radius: 6px; }
.pk-chg.is-up { color: var(--pos); background: color-mix(in srgb, var(--pos) 12%, transparent); }
.pk-chg.is-down { color: var(--neg); background: color-mix(in srgb, var(--neg) 12%, transparent); }
.pk-lamt { font: 600 16px/1 var(--font-num); letter-spacing: -.015em; }
.pk-utile { --sc: var(--dim); width: 40px; height: 42px; flex: none; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--fill); }
.pk-utile span { font: 650 9.5px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--sc); }
.pk-utile strong { font: 600 17px/1 var(--font-num); letter-spacing: -.02em; }

/* ---------------- Home: the hero card ---------------- */
.pk-hero-host { touch-action: pan-y; }
.pk-hero-card { position: relative; padding: 20px 20px 14px; border-radius: 30px; background: var(--hero-bg); color: var(--hero-text); overflow: hidden; }
.pk-hc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pk-hc-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pk-hc-k { font: 500 13px/1.2 var(--font); color: var(--hero-dim); }
.pk-hc-title { display: flex; align-items: center; gap: 8px; margin: 0; font: 650 17px/1.2 var(--font-display); letter-spacing: -.02em; }
.pk-tag { padding: 3px 7px; border-radius: 6px; background: var(--hero-btn); color: var(--hero-dim); font: 600 11px/1 var(--font); letter-spacing: 0; }
.pk-hc-big { margin: 14px 0 8px; font: 700 58px/1 var(--font-display); letter-spacing: -.045em; white-space: nowrap; }
.pk-dec { margin-left: 1px; font-size: .4em; font-weight: 600; letter-spacing: -.01em; color: var(--hero-dim); }
.pk-delta { display: flex; align-items: center; gap: 5px; margin: 0; font: 550 14px/1.35 var(--font); letter-spacing: -.01em; }
.pk-delta-a { font-weight: 700; }
.pk-delta.is-good { color: var(--pos); } .pk-delta.is-bad { color: var(--neg); } .pk-delta.is-flat { color: var(--dim); }
.pk-hero-card .pk-delta.is-good { color: var(--hero-pos); } .pk-hero-card .pk-delta.is-bad { color: var(--hero-neg); } .pk-hero-card .pk-delta.is-flat { color: var(--hero-dim); }
.pk-hc-note { margin: 4px 0 0; font-size: 14px; color: var(--hero-dim); }
.pk-hc-note strong { color: var(--hero-text); font-weight: 600; }
.pk-hc-bar { margin: 18px 0 8px; }
.pk-hc-bar .cf-stack span { transform-origin: left; animation: pk-grow-x .8s var(--cf-ease-out) backwards; }
.pk-hc-bar-empty { display: block; height: 6px; border-radius: 3px; background: var(--hero-track); }
.pk-hc-legend { display: flex; flex-wrap: wrap; gap: 0 12px; margin: 0 -6px; }
.pk-hc-li { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--hero-dim); font: 500 13px/1 var(--font); transition: background-color .15s; }
.pk-hc-li:active { background: var(--hero-btn); }

.pk-hc-li strong { color: var(--hero-text); font: 600 13px/1 var(--font-num); }
.pk-hc-lump { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 10px; padding: 12px 0 2px; border: 0; border-top: .5px solid var(--hero-line); background: transparent; color: var(--hero-dim); font: 500 13.5px/1.35 var(--font); text-align: left; }
.pk-hc-lump strong { color: var(--hero-text); font-weight: 600; }
.pk-hc-lump .pk-ic { color: var(--s-lumpsum); }
.pk-hc-lump > span:nth-child(2) { flex: 1; min-width: 0; }
.pk-hc-lump-go { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--hero-btn); color: var(--tint); font: 600 13px/1 var(--font); }

.pk-spend { display: block; width: 100%; padding: 0; border: 0; text-align: left; color: var(--text); transition: scale .3s var(--spring-pop); }
.pk-spend:active { scale: .985; }
.pk-spend-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px 12px; }
.pk-spend-row strong { font: 700 22px/1.1 var(--font-num) !important; letter-spacing: -.03em; }
.pk-spend-row .pk-ic:last-child { color: var(--dim); opacity: .5; }
.pk-spend-bar { display: block; padding: 0 16px 16px; }

/* ---------------- Work ---------------- */
.pk-job { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
.pk-job-thumb { width: calc((100% - 4px) / var(--n, 3)); transform: translateX(calc(var(--ji, 0) * 100%)); }
.pk-job-btn { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 36px; border: 0; background: transparent; color: var(--dim); font: 600 15px/1 var(--font); letter-spacing: -.01em; transition: color .25s; }
.pk-job-btn[aria-checked="true"] { color: var(--text); }
.pk-job-btn i { width: 7px; height: 7px; border-radius: 50%; transition: scale .35s var(--spring-pop), opacity .25s; }
.pk-job-btn[data-j="job"] i { background: var(--s-job); } .pk-job-btn[data-j="gig"] i { background: var(--s-gig); } .pk-job-btn[data-j="hourly"] i { background: var(--s-hourly); }
.pk-job-btn[aria-checked="false"] i { scale: .7; opacity: .5; }

.pk-mhead { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.pk-mhead .pk-h2 { padding-left: 4px; }

.pk-card-h .pk-pay-net { margin: 4px 0 0; }
.pk-pay-net { font: 700 30px/1 var(--font-display); letter-spacing: -.035em; }
.pk-pay-net span:last-child { font: 500 13px/1 var(--font); letter-spacing: 0; color: var(--dim); white-space: nowrap; }
.pk-chain { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-radius: 14px; background: var(--surface-2); }
.pk-chain-step { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pk-chain-step span { font-size: 11.5px; font-weight: 500; color: var(--dim); }
.pk-chain-step strong { font: 600 15px/1 var(--font-num); letter-spacing: -.01em; }
.pk-chain-step.is-net { margin-left: auto; text-align: right; }
.pk-chain-step.is-net strong { color: var(--pos); }
.pk-chain-op { color: var(--dim); font-weight: 500; }
.pk-hours { margin-top: 16px; }
.pk-hours-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 13.5px; color: var(--dim); }
.pk-hours-h strong { font: 700 17px/1 var(--font-num); letter-spacing: -.02em; color: var(--text); }
.pk-progress { position: relative; height: 6px; border-radius: 3px; background: var(--fill); }
.pk-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--s-job); transform-origin: left; animation: pk-grow-x .9s var(--cf-ease-out) .1s backwards; }
.pk-progress-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); opacity: .5; }
.pk-proj { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 14px; padding: 11px 13px; border-radius: 14px; background: color-mix(in srgb, var(--pos) 9%, var(--surface)); }
.pk-proj span { font-size: 12.5px; color: var(--dim); }
.pk-proj span:first-child { width: 100%; font-weight: 550; }
.pk-proj strong { font: 700 18px/1 var(--font-num); letter-spacing: -.02em; }

.pk-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.pk-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
.pk-legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.pk-legend i.is-full { background: var(--s-job); }
.pk-legend i.is-part { background: color-mix(in srgb, var(--s-job) 35%, var(--surface)); }
.pk-legend i.is-leave { background: color-mix(in srgb, var(--s-lumpsum) 55%, var(--surface)); }
.pk-legend i.is-gap { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fill-2); }
.pk-legend i.is-cur { background: var(--line-in); } .pk-legend i.is-prev { background: var(--dim); opacity: .4; }
.pk-days .pk-card-h { flex-wrap: wrap; }
.pk-cal-host { touch-action: pan-y; }
.pk-days .cf-cal-day { min-height: 42px; background: var(--fill); }
.pk-days .cf-cal-day.is-we { background: transparent; }
.pk-days .cf-cal-day.is-full { background: var(--s-job); color: var(--on-job); }
.pk-days .cf-cal-day.is-part { background: color-mix(in srgb, var(--s-job) 22%, var(--surface)); }
.pk-days .cf-cal-day.is-leave { background: color-mix(in srgb, var(--s-lumpsum) 30%, var(--surface)); }
.pk-days .cf-cal-day.is-gap { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fill-2); }
.pk-days .cf-cal-day.is-today { box-shadow: inset 0 0 0 2px var(--tint); }
.pk-days .cf-cal-num { font-weight: 550; }
.pk-calv { align-self: flex-end; font: 600 10.5px/1 var(--font-num); }

.pk-leave { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.pk-leave-tile { display: flex; flex-direction: column; gap: 4px; padding: 12px 13px; border-radius: 14px; background: var(--surface-2); }
.pk-leave-tile span { font-size: 12px; color: var(--dim); }
.pk-leave-tile strong { font: 700 26px/1 var(--font-display); letter-spacing: -.03em; }
.pk-leavecard .pk-list.is-flush, .pk-claims .pk-list.is-flush, .pk-sessions .pk-list.is-flush { border-top: .5px solid var(--hair); }
.pk-kv { display: flex; flex-direction: column; }
.pk-kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 14px; }
.pk-kv-row + .pk-kv-row { border-top: .5px solid var(--hair); }
.pk-kv-row span { color: var(--dim); }
.pk-kv-row strong { font-weight: 550; text-align: right; }
.pk-sys .pk-card-h { flex-wrap: wrap; }
.pk-syncline { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); }

.pk-claim, .pk-tasum { background: var(--surface); }
.pk-claim-amt { margin: 4px 0 0; font: 700 34px/1 var(--font-display); letter-spacing: -.04em; }
.pk-claim-meta { align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--sc) 12%, transparent); color: var(--sc); font: 600 12px/1 var(--font); white-space: nowrap; }
.pk-claim-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pk-claim-dates > div { display: flex; flex-direction: column; gap: 4px; padding: 11px 13px; border-radius: 14px; background: var(--surface-2); }
.pk-claim-dates span { font-size: 11.5px; font-weight: 500; color: var(--dim); }
.pk-claim-dates strong { font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
.pk-claim-dates em { font-style: normal; font-size: 12px; color: var(--dim); }
.pk-claim-who { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 12px 13px; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--text); text-align: left; font-size: 14px; }
.pk-claim-who > span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-claim-who > .pk-ic { color: var(--dim); }
.pk-claim .pk-btn.is-primary, .pk-tasum .pk-btn.is-primary { flex: 1 1 auto; }

/* ---------------- Money ---------------- */
.pk-switch { display: flex; align-items: center; gap: 12px; margin: 0 0 0 4px; padding: 6px 0; border: 0; background: transparent; color: var(--text); font: 500 15px/1 var(--font); letter-spacing: -.01em; align-self: flex-start; }
/* iOS 26 switch: wider track, capsule knob that turns to glass while you hold it */
.pk-switch-k { position: relative; flex: none; width: 60px; height: 28px; border-radius: 999px; background: var(--fill-2); transition: background-color .3s; }
.pk-switch-k::after { content: ''; position: absolute; top: 2px; left: 2px; width: 36px; height: 24px; border-radius: 999px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .08); transition: transform .45s var(--spring), scale .3s var(--spring-pop), background-color .2s, box-shadow .2s; }
[aria-checked="true"] > .pk-switch-k { background: #34c759; }
[aria-checked="true"] > .pk-switch-k::after { transform: translateX(20px); }
.pk-switch:active .pk-switch-k::after { scale: 1.14 1.22; background: var(--lens-bg); box-shadow: var(--lens-sh); }
.pk-pad { padding: 16px; }
.pk-chart { margin-top: 8px; }
.pk-summary { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--dim); }
.pk-summary strong { color: var(--text); font-weight: 600; }
.pk-summary strong.is-good { color: var(--pos); } .pk-summary strong.is-bad { color: var(--neg); }
.pk-subhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 6px; font-size: 13px; font-weight: 600; }
.pk-sk { min-height: 150px; }
.pk-flow .cf-sk-name { font-size: 12px; font-weight: 550; }
.pk-skcap { margin: 10px 0 0; min-height: 2.8em; font-size: 14px; line-height: 1.45; color: var(--dim); }
.pk-skcap strong { color: var(--text); }
:root[data-scheme="dark"] .pk-flow .cf-sk-flows { filter: saturate(1.2) brightness(1.2); }
.pk-spend-total { font: 700 22px/1 var(--font-display); letter-spacing: -.03em; }
.pk-cat { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "dot main amt" ". bar bar"; align-items: center; gap: 6px 12px; padding: 12px 16px 13px; }
.pk-list > .pk-cat + .pk-cat::after { left: 38px; }
.pk-cat-dot { grid-area: dot; width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.pk-cat .pk-srow-main { grid-area: main; }
.pk-cat-amt { grid-area: amt; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.pk-cat-amt strong { font: 600 16px/1 var(--font-num); letter-spacing: -.015em; }
.pk-cat-amt span { font-size: 12px; color: var(--dim); }
.pk-cat-bar { grid-area: bar; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.pk-cat-bar span { display: block; height: 100%; border-radius: 2px; background: var(--cc); transform-origin: left; animation: pk-grow-x .8s var(--cf-ease-out) .1s backwards; }

/* ---------------- More ---------------- */
.pk-select { height: 34px; padding: 0 30px 0 14px; border: 0; border-radius: 999px; background-color: var(--fill); color: var(--text); font: 600 14px/1 var(--font); -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.pk-mini-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--fill); }
.pk-mini-seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--dim); font: 600 13px/1 var(--font); transition: background-color .25s, color .25s; }
.pk-mini-seg button[aria-checked="true"] { background: var(--seg-thumb); color: var(--text); box-shadow: var(--seg-sh); }
.pk-foot { margin: 26px 16px 0; font-size: 12.5px; line-height: 1.55; color: var(--dim); text-align: center; }

/* ---------------- Sheets: inset, floating glass (iOS 26/27) ---------------- */
.cf-scrim { -webkit-backdrop-filter: none; backdrop-filter: none; }
.cf-sheet.is-bottom {
  left: 8px; right: 8px; bottom: max(8px, calc(var(--cf-bottom) + 4px)); padding-bottom: 6px;
  max-height: calc(100dvh - var(--cf-top) - 40px); border-radius: var(--sheet-radius);
  transform: translate3d(0, calc(100% + 80px), 0);
}
.cf-sheet.is-drawer { top: calc(var(--cf-top) + 10px); right: 10px; bottom: 10px; border-radius: 28px; }
.cf-sheet.is-modal { border-radius: 28px; }
.cf-sheet-head { padding: 14px 16px 10px 22px; }
.cf-sheet-title { font: 700 20px/1.2 var(--font-display); letter-spacing: -.022em; }
.cf-sheet-x { position: relative; width: 36px; height: 36px; background: var(--fill); color: var(--text); font-size: 22px; font-weight: 400; transition: scale .3s var(--spring-pop); }
.cf-sheet-x:active { scale: .9; }
.cf-sheet.is-bottom .cf-grab { width: 36px; background: var(--fill-2); }
.cf-sheet-body { padding: 4px 22px 18px; }
.cf-sheet-foot { border-top: 0; padding: 10px 16px 12px; }
.cf-btn { min-height: 50px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--fill); color: var(--text); font: 600 16px/1 var(--font); letter-spacing: -.015em; transition: scale .3s var(--spring-pop), opacity .2s; }
.cf-btn:active { transform: none; scale: .96; }
.cf-btn.is-primary { background: var(--prominent); color: #fff; box-shadow: var(--prominent-sh); }
.cf-btn.is-danger { background: transparent; color: var(--neg); }
.cf-input { min-height: 46px; font-size: 16px; }
.cf-input:focus { border-color: transparent; box-shadow: 0 0 0 2px var(--tint); }
.cf-chip { border-color: var(--hair); border-radius: 14px; }
.cf-total { background: var(--fill); border-radius: 14px; }
.cf-seg-btn { border-radius: 14px; }
.cf-step { border-radius: 10px; background: var(--surface); }
:root[data-scheme="dark"] .cf-step { background: #636366; }
.pk-ss .pk-lrow { background: transparent; }
.pk-sdhead { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
.pk-sd-amt { margin: 0; font: 700 30px/1 var(--font-display); letter-spacing: -.035em; }
.pk-sdhead .pk-note { margin-top: 4px; }
.pk-g { margin-top: 14px; }
.pk-g .pk-h3 { margin-bottom: 8px; }
.pk-ylist { display: flex; flex-direction: column; }
.pk-yrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 78px; align-items: center; gap: 10px; min-height: 46px; margin: 0 -6px; padding: 4px 6px; border: 0; border-radius: 12px; background: transparent; color: var(--text); text-align: left; transition: background-color .15s; }
.pk-yrow:active { background: var(--fill); }
.pk-yrow.is-sample .pk-ybar span { opacity: .55; }
.pk-yrow-m { font-size: 13px; font-weight: 550; color: var(--dim); }
.pk-ybar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.pk-ybar span { display: block; height: 100%; border-radius: 3px; background: var(--sc); transform-origin: left; animation: pk-grow-x .7s var(--cf-ease-out) backwards; }
.pk-yrow-x { font-size: 12px; color: var(--dim); white-space: nowrap; }
.pk-yrow strong { text-align: right; font: 600 14px/1 var(--font-num); }

/* toast + pull: small glass capsules */
.cf-toast { bottom: calc(var(--cf-bottom) + var(--toast-offset)); padding: 13px 18px; border-radius: 999px; color: var(--text); font: 500 14.5px/1.25 var(--font); letter-spacing: -.01em; }
.cf-toast button { color: var(--tint); text-decoration: none; font-weight: 600; }
.cf-pull { color: var(--text); }

/* ---------------- Hover (decoration only; everything also works by tap) ---------------- */
@media (hover: hover) and (pointer: fine) {
  .pk-srow:not(.is-static):hover, .pk-urow:hover, .pk-lrow:hover { background: color-mix(in srgb, var(--surface) 94%, var(--text)); }
  .pk-yrow:hover { background: var(--fill); }
  .pk-top .pk-tab:not(.is-on):hover { color: var(--text); }
  .pk-act:hover { background: var(--g-sel); }
  .pk-top .pk-sync:hover { background: var(--fill); color: var(--text); }
  .pk-btn.is-secondary:hover, .pk-chip:not(.is-on):hover, .pk-card-h .pk-link:hover, .pk-srow > .pk-link:hover, .cf-btn:not(.is-primary):not(.is-danger):hover { background: var(--fill-2); }
  .pk-btn.is-primary:hover, .cf-btn.is-primary:hover { filter: brightness(1.06); }
  .pk-spend:hover { background: color-mix(in srgb, var(--surface) 96%, var(--text)); }
  .pk-hc-lump:hover .pk-hc-lump-go { background: var(--fill-2); }
  .pk-mi:hover { background: var(--g-sel); }
}

/* ---------------- Medium widths (720–1023): one roomy column, the bar stays compact ---------------- */
@media (min-width: 720px) {
  .pk-main { max-width: 720px; margin: 0 auto; }
  .pk-view { padding-left: 20px; padding-right: 20px; }
  .pk-strip { margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .pk-period > .pk-strip { margin-right: -20px; padding-left: 6px; }
  .pk-hc-big { font-size: 64px; }
  .pk-top { padding: 0 24px; }
  .pk-dock { left: 50%; right: auto; width: min(540px, calc(100vw - 32px)); transform: translateX(-50%); }
  .cf-sheet.is-bottom { left: 50%; right: auto; width: min(560px, calc(100vw - 16px)); transform: translate3d(-50%, calc(100% + 80px), 0); }
  .cf-sheet-root.is-open .cf-sheet.is-bottom { transform: translate3d(-50%, 0, 0); }
}

/* ---------------- Laptop (≥ 1024): a conventional full-width navbar + two columns ----------------
   Logo, then the sections as text links (the current one darker and underlined), then sync status and a primary Add
   on the right. The bar spans the window with a hairline under it; its contents line up with the page. */

<script>/* ../core/format.js */
/* Shared formatting + date helpers. Classic script (no modules) so every design
   can be inlined into ONE self-contained HTML file, the same shape a Muse space ships as.
   All money in the data layer is integer cents, exactly like the Muse actions. */
(function () {
  const CF = (window.CF = window.CF || {});

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /** money(12345) → "$123"; {cents:true} → "$123.45"; {compact:true} → "$1.2k"; {sign:true} → "+$123" */
  function money(c, { cents = false, sign = false, compact = false } = {}) {
    if (c == null || Number.isNaN(c)) return '—';
    const v = c / 100;
    const neg = v < -0.004;
    const a = Math.abs(v);
    let s;
    if (compact && a >= 1000) {
      const k = a / 1000;
      s = (k >= 100 ? Math.round(k) : k.toFixed(1).replace(/\.0$/, '')) + 'k';
    } else s = cents ? nf2.format(a) : nf0.format(Math.round(a));
    return (neg ? '−' : sign && v > 0.004 ? '+' : '') + '$' + s;
  }
  /** Split for big display numbers: {sign, whole, dec} */
  function moneyParts(c) {
    const a = Math.abs(c || 0);
    return { sign: c < 0 ? '−' : '', whole: nf0.format(Math.floor(a / 100)), dec: String(a % 100).padStart(2, '0') };
  }
  function pct(v, { sign = false, digits = 0 } = {}) {
    if (v == null || !Number.isFinite(v)) return '—';
    const s = Math.abs(v * 100).toFixed(digits);
    return (v < 0 ? '−' : sign && v > 0 ? '+' : '') + s + '%';
  }
  /** Relative change, null when there's no meaningful base (avoids "+∞%"). */
  function change(cur, prev) {
    if (prev == null || cur == null || Math.abs(prev) < 100) return null;
    return (cur - prev) / Math.abs(prev);
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  const monthKey = (y, m0) => `${y}-${pad2(m0 + 1)}`;
  const parseMonth = (k) => { const [y, m] = k.split('-').map(Number); return { y, m: m - 1 }; };
  function addMonths(k, n) {
    const { y, m } = parseMonth(k);
    const t = y * 12 + m + n;
    return monthKey(Math.floor(t / 12), ((t % 12) + 12) % 12);
  }
  const monthDiff = (a, b) => { const A = parseMonth(a), B = parseMonth(b); return (B.y - A.y) * 12 + (B.m - A.m); };
  const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const daysIn = (k) => { const { y, m } = parseMonth(k); return new Date(y, m + 1, 0).getDate(); };
  function monthLabel(k, { long = false, year = true, short = false } = {}) {
    const { y, m } = parseMonth(k);
    return `${(long ? MONTHS_LONG : MONTHS)[m]}${year ? (short ? " '" + String(y).slice(2) : ' ' + y) : ''}`;
  }
  function dayLabel(s, { long = false } = {}) {
    const d = parseYmd(s);
    return long ? `${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()]} ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}` : `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }
  const shortDate = (s) => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return `${h % 12 || 12}${m ? ':' + pad2(m) : ''}${h >= 12 ? 'pm' : 'am'}`;
  }
  /** 150 → "2.5h", 45 → "45m" */
  function hours(min, { short = false } = {}) {
    if (!min) return '0h';
    if (min < 60 && short) return `${min}m`;
    const h = min / 60;
    return `${Number.isInteger(h) ? h : parseFloat(h.toFixed(2))}h`;
  }
  function ago(iso, now = Date.now()) {
    if (!iso) return 'never';
    const s = Math.max(0, (now - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  }
  const sum = (a, f = (x) => x) => a.reduce((t, x) => t + (f(x) || 0), 0);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = (p = 'id') => `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  /** Tiny DOM builder: h('div.card#id', {onclick, style:{}, 'aria-label':''}, children...) */
  function h(sel, props, ...kids) {
    const m = sel.match(/^([a-z0-9-]+)?((?:[.#][\w-]+)*)$/i);
    const el = document.createElement((m && m[1]) || 'div');
    if (m && m[2]) for (const p of m[2].match(/[.#][\w-]+/g)) p[0] === '.' ? el.classList.add(p.slice(1)) : (el.id = p.slice(1));
    if (props != null && (typeof props !== 'object' || props instanceof Node || Array.isArray(props))) { kids.unshift(props); props = null; }
    for (const k in props || {}) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'class') el.className += ' ' + v;
      else if (k in el && k !== 'list' && k !== 'form') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    const add = (c) => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c instanceof Node ? c : document.createTextNode(String(c))); };
    kids.forEach(add);
    return el;
  }

  CF.fmt = { MONTHS, MONTHS_LONG, DOW, money, moneyParts, pct, change, pad2, monthKey, parseMonth, addMonths, monthDiff, parseYmd, ymd, daysIn, monthLabel, dayLabel, shortDate, toMin, fmtTime, hours, ago, sum, clamp, uid, esc, reducedMotion };
  CF.h = h;
})();
</script>
<script>/* ../core/data.js */
/* Data layer. Classic script; load after core/format.js.

   setup        What this space tracks: which income streams exist, their labels, rates and pay rules.
                Muse fills it in (saveSetup). Nothing about any one person is hard-coded here; with no
                setup the app is a blank slate. Schema: docs/MUSE.md.
   CF.data      Synchronous view-models (month, year, series, upcoming) the app renders from.
   CF.actions   Async writes, named exactly like the space's server actions. core/muse.js forwards them
                to Muse; in a plain browser (local preview) they only change memory.

   All money is integer cents. Months are "YYYY-MM", days "YYYY-MM-DD". */
(function () {
  const CF = window.CF, F = CF.fmt;
  const SNAP = CF.snapshot || null; // dev only: core/snapshot.local.js (gitignored), injected by tools/serve.mjs
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;
  const query = new URLSearchParams(location.search);

  /* ---------------- Setup ---------------- */
  const KINDS = ['job', 'gig', 'hourly', 'lumpsum', 'dividends'];
  const DEFAULTS = {
    // Monthly pay, prorated by hours worked over (weekdays × dayMinutes). Days, leave and claims live in a
    // timesheet system (the `system` label) that the space syncs with.
    // deduction: an optional contribution taken off gross pay (see deduct()). leaveTypes: [{code, name}].
    job: { label: 'Job', short: 'Job', icon: 'briefcase', monthlyPayCents: 0, dayMinutes: 480, deduction: null, system: 'Timesheet', startMonth: null, endMonth: null, leave: true, claims: true, leaveTypes: null, day: { start: '09:00', end: '18:00', breakStart: '12:00', breakEnd: '13:00' } },
    // Paid per session; optionally claimed with a monthly form (claim) and a filled-in template (claimForm).
    gig: { label: 'Sessions', short: 'Sessions', icon: 'timer', rateCents: 0, sessionMinutes: 60, venue: '', rateNote: '', claim: null, claimForm: null, presets: [] },
    // Paid by the hour. payout: 'monthly', or {label, periods:[{from, to, paidIn}]} for work paid in one block after a period.
    hourly: { label: 'Hourly work', short: 'Hourly', icon: 'hourglass', rateCents: null, unitLabel: 'Project', payout: 'monthly', presets: [] },
    // One payment a year (a bonus, grant or award), kept out of monthly comparisons.
    lumpsum: { label: 'Yearly payment', short: 'Yearly', icon: 'award', yearlyCents: 0, receiptMonth: 0 },
    // Read-only, from the income statement.
    dividends: { label: 'Dividends', short: 'Dividends', icon: 'leaf', source: '' },
  };
  const SAMPLE_SETUP = {
    version: 1, currency: 'USD',
    streams: {
      job: { label: 'Studio assistant', short: 'Studio', monthlyPayCents: 210000, dayMinutes: 450, deduction: { label: 'Pension', rate: 0.05 }, system: 'Timesheet', day: { start: '09:30', end: '17:30', breakStart: '13:00', breakEnd: '13:30' } },
      gig: { label: 'Photography', short: 'Photo', icon: 'camera', rateCents: 6000, sessionMinutes: 90, venue: 'On location', claim: { to: '', dueWorkingDay: 5, payFromDay: 20, payToDay: 25 } },
      hourly: { label: 'Tutoring', short: 'Tutoring', icon: 'book', rateCents: 2800, unitLabel: 'Student' },
      lumpsum: { label: 'Annual bonus', short: 'Bonus', yearlyCents: 300000, receiptMonth: 12 },
      dividends: { label: 'Dividends', short: 'Dividends', source: 'Brokerage' },
    },
    expenses: { label: 'Spending app', detail: '' },
  };
  const DEFAULT_LEAVE = [{ code: 'AL', name: 'Annual leave' }, { code: 'MC', name: 'Medical leave' }, { code: 'UL', name: 'Unpaid leave' }];

  function normSetup(s) {
    if (!s || typeof s !== 'object') return null;
    const src = s.streams && typeof s.streams === 'object' ? s.streams : {};
    const out = { version: 1, currency: String(s.currency || 'USD').slice(0, 6), timeZone: s.timeZone || null, paymentIdLabel: s.paymentIdLabel || 'Payment ID', streams: {}, expenses: null };
    for (const k of KINDS) {
      const v = src[k];
      if (!v || typeof v !== 'object' || v.enabled === false) continue;
      const st = { ...DEFAULTS[k], ...v, id: k };
      st.short = st.short || st.label;
      if (k === 'job') {
        st.day = { ...DEFAULTS.job.day, ...(v.day || {}) };
        st.deduction = v.deduction && typeof v.deduction === 'object' ? { label: 'Deductions', rate: 0, ...v.deduction } : null;
        st.leaveTypes = Array.isArray(v.leaveTypes) && v.leaveTypes.length ? v.leaveTypes.filter((x) => x && x.code) : DEFAULT_LEAVE;
      }
      if (k === 'hourly') st.payout = v.payout && typeof v.payout === 'object' && Array.isArray(v.payout.periods) && v.payout.periods.length ? { label: 'paid in one block', ...v.payout } : 'monthly';
      if (k === 'gig') st.claim = v.claim && typeof v.claim === 'object' ? { to: '', dueWorkingDay: null, payFromDay: null, payToDay: null, ...v.claim } : null;
      if (k === 'gig' || k === 'hourly') st.presets = Array.isArray(v.presets) ? v.presets.slice(0, 4) : [];
      out.streams[k] = st;
    }
    if (s.expenses && typeof s.expenses === 'object' && s.expenses.enabled !== false) out.expenses = { label: 'Spending', detail: '', ...s.expenses };
    return out;
  }
  const SAMPLE_N = normSetup(SAMPLE_SETUP);

  /* ---------------- State ---------------- */
  const state = {
    sample: query.get('sample') === '1',
    setup: null,        // normalised setup, or null while the space isn't set up
    rawSetup: null,     // exactly what was saved, so saveSetup round-trips unknown fields
    months: {},         // 'YYYY-MM' → { job:{timesheet,leave,expenses,pendingCount}, gig:{sessions}, hourly:{sessions}, statement }
    custom: [],         // income sources you add: {id,label,short,type,rateCents,startMonth,entries:[{id,date,amountCents,qty,note}]}
    profile: { fullName: '', bankAccount: '', paymentId: '' }, // printed on claim forms
    sync: { source: 'none', status: 'idle', at: null, error: null },
  };
  let remote = null;   // dev only: the timesheet proxy writer from core/live.js
  let persist = null;  // dev only: saves local edits to data/state.local.json through tools/serve.mjs
  const subs = new Set();
  const emit = () => subs.forEach((f) => f());
  const slot = (k) => (state.months[k] = state.months[k] || {});
  const monthCache = new Map();
  let firstRealCache;
  const changed = () => { monthCache.clear(); firstRealCache = undefined; emit(); };

  /** The setup the app shows: yours, or the sample one while sample data is on and nothing is set up. */
  const setup = () => state.setup || (state.sample ? SAMPLE_N : null);
  const S = (k) => { const s = setup(); return (s && s.streams[k]) || null; };
  function applySetup(raw) {
    state.rawSetup = raw && typeof raw === 'object' ? clone(raw) : null;
    state.setup = normSetup(state.rawSetup);
    tzReset();
  }

  /* ---------------- Clock (in the setup's time zone, else the device's) ---------------- */
  const OVERRIDE = MONTH_RE.test((query.get('today') || '').slice(0, 7)) ? query.get('today') : null;
  let fmtDay, fmtTime, day = { at: 0, v: '' };
  function tzReset() {
    const tz = (setup() && setup().timeZone) || undefined;
    try { fmtDay = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }); fmtTime = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }); }
    catch (_) { fmtDay = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }); fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }); }
    day.at = 0;
  }
  tzReset();
  /** Today, re-read at most every 30 s; a new day clears the cached months (isNow, projections). */
  function today() {
    if (OVERRIDE) return OVERRIDE;
    const t = Date.now();
    if (t - day.at > 30000) { const v = fmtDay.format(new Date()); if (v !== day.v) { day.v = v; monthCache.clear(); } day.at = t; }
    return day.v;
  }
  const nowKey = () => today().slice(0, 7);

  /* ---------------- Pay rules ---------------- */
  function weekdays(month) {
    const { y, m } = F.parseMonth(month);
    let n = 0;
    for (let d = 1; d <= F.daysIn(month); d++) { const w = new Date(y, m, d).getDay(); if (w >= 1 && w <= 5) n++; }
    return n;
  }
  function workedMin(e) {
    const a = F.toMin(e.start), b = F.toMin(e.end);
    if (a == null || b == null) return 0;
    let n = b - a;
    const bs = F.toMin(e.breakStart), be = F.toMin(e.breakEnd);
    if (bs != null && be != null) n -= be - bs;
    return Math.max(0, n) + (e.overtimeMinutes || 0);
  }
  /** A contribution taken off gross pay, from setup.streams.job.deduction:
      {label, rate, freeUpToCents?, phaseInToCents?, phaseInRate?, capCents?, roundDownToDollar?}.
      Nothing up to freeUpToCents; then phaseInRate × (gross − freeUpToCents) up to phaseInToCents; above that,
      rate × gross, with gross capped at capCents. */
  function deduct(c, d) {
    if (!d || c <= 0) return 0;
    const free = d.freeUpToCents || 0;
    if (c <= free) return 0;
    if (d.phaseInToCents && c <= d.phaseInToCents) { const v = (d.phaseInRate || 0) * (c - free); return d.roundDownToDollar ? Math.floor(v / 100 + 1e-9) * 100 : Math.round(v); }
    return Math.round(Math.min(c, d.capCents || Infinity) * (d.rate || 0));
  }
  const dayMinutes = () => (S('job') ? S('job').dayMinutes : DEFAULTS.job.dayMinutes);
  function jobPay(month, mins) {
    const j = S('job');
