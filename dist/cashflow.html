    upsert(s[part].sessions, entry);
    changedLocal();
    return done();
  }
  function deleteSession(part, id) { sessionsIn(part).forEach((x) => (x.sessions = x.sessions.filter((y) => y.id !== id))); changedLocal(); return done(); }

  /** Everything, in the shape `loadAll` returns (also what dev mode saves to data/state.local.json). */
  function exportAll() {
    return { version: 2, setup: clone(state.rawSetup), profile: clone(state.profile), sources: clone(state.custom), months: clone(state.months), syncedAt: state.sync.at };
  }
  /** Only what has no other home in dev mode (the timesheet forms come from the proxy). */
  function exportLocal() {
    const gig = {}, hourly = {};
    for (const [k, v] of Object.entries(state.months)) { if (v.gig && v.gig.sessions.length) gig[k] = v.gig.sessions; if (v.hourly && v.hourly.sessions.length) hourly[k] = v.hourly.sessions; }
    return { version: 2, savedAt: new Date().toISOString(), setup: state.rawSetup, profile: state.profile, custom: state.custom, gig, hourly };
  }
  function importLocal(o) {
    if (!o || o.version !== 2) return;
    if (o.setup) applySetup(o.setup);
    if (o.profile) state.profile = { ...state.profile, ...o.profile };
    if (Array.isArray(o.custom)) state.custom = o.custom;
    for (const [k, list] of Object.entries(o.gig || {})) slot(k).gig = { sessions: list };
    for (const [k, list] of Object.entries(o.hourly || {})) slot(k).hourly = { sessions: list };
    changed();
  }
  /** Take what Muse's `loadAll` returned. Months not mentioned are left as they are. */
  function hydrate(d) {
    if (!d || typeof d !== 'object') return;
    if ('setup' in d) applySetup(d.setup);
    if (d.profile && typeof d.profile === 'object') state.profile = { ...state.profile, ...d.profile };
    if (Array.isArray(d.sources)) state.custom = d.sources.filter((s) => s && s.id).map((s) => ({ ...s, entries: Array.isArray(s.entries) ? s.entries : [] }));
    if (d.months && typeof d.months === 'object') {
      for (const [k, v] of Object.entries(d.months)) {
        if (!MONTH_RE.test(k) || !v || typeof v !== 'object') continue;
        const s = slot(k);
        if (v.job !== undefined) s.job = v.job;
        for (const part of ['gig', 'hourly']) if (v[part] !== undefined) s[part] = { sessions: (v[part] && Array.isArray(v[part].sessions) ? v[part].sessions : []) };
        if (v.statement !== undefined) s.statement = v.statement;
      }
    }
    if (d.syncedAt) state.sync.at = d.syncedAt;
    changed();
  }
  if (SNAP) { hydrate(SNAP); state.sync = { source: 'snapshot', status: 'idle', at: SNAP.capturedAt || null, error: null }; }

  const actions = {
    loadAll: async () => exportAll(),
    saveSetup: async ({ setup: s }) => { applySetup(s); Object.keys(sampleCache).forEach((k) => delete sampleCache[k]); changedLocal(); return done(); },
    saveProfile: async ({ fullName = '', bankAccount = '', paymentId = '' } = {}) => { state.profile = { fullName, bankAccount, paymentId }; changedLocal(); return done(); },
    saveGigSession: async ({ entry }) => saveSession('gig', entry),
    deleteGigSession: async ({ id }) => deleteSession('gig', id),
    saveHourlySession: async ({ entry }) => saveSession('hourly', entry),
    deleteHourlySession: async ({ id }) => deleteSession('hourly', id),
    /* ---- the job's timesheet, leave and claims forms ---- */
    saveWorkEntry: async ({ month: k, entry, previousDate }) => {
      if (previousDate && previousDate !== entry.date) { const r = await formWrite('timesheet', k, 'delete', previousDate); if (!r.ok) return r; }
      return formWrite('timesheet', k, 'put', entry.date, entry);
    },
    deleteWorkEntry: async ({ month: k, date }) => formWrite('timesheet', k, 'delete', date),
    saveLeaveEntry: async ({ month: k, entry }) => formWrite('leave', k, 'put', entry.id, entry),
    deleteLeaveEntry: async ({ month: k, id }) => formWrite('leave', k, 'delete', id),
    saveExpenseEntry: async ({ month: k, entry }) => formWrite('expenses', k, 'put', entry.id, entry),
    deleteExpenseEntry: async ({ month: k, id }) => formWrite('expenses', k, 'delete', id),
    uploadAttachment: async ({ kind, month: k, file }) => (remote && remote.upload ? remote.upload({ kind, month: k, file }) : done({ ok: true, id: F.uid('att'), name: file && file.name, local: true })),
    refresh: async ({ month: k } = {}) => {
      if (remote && remote.refresh) return remote.refresh({ month: k });
      state.sync.at = new Date().toISOString(); changed(); return done();
    },
    /* ---- income sources you add yourself ---- */
    saveIncomeSource: async ({ source }) => { const ex = state.custom.find((s) => s.id === source.id); ex ? Object.assign(ex, source) : state.custom.push({ entries: [], ...source }); changedLocal(); return done(); },
    deleteIncomeSource: async ({ id }) => { state.custom = state.custom.filter((s) => s.id !== id); changedLocal(); return done(); },
    saveIncomeEntry: async ({ sourceId, entry }) => { const s = state.custom.find((x) => x.id === sourceId); if (!s) return done({ ok: false, error: 'Unknown source' }); upsert(s.entries, entry); changedLocal(); return done(); },
    deleteIncomeEntry: async ({ sourceId, id }) => { const s = state.custom.find((x) => x.id === sourceId); if (s) s.entries = s.entries.filter((e) => e.id !== id); changedLocal(); return done(); },
  };

  CF.actions = actions;
  CF.data = {
    get today() { return today(); }, get now() { return nowKey(); },
    month, year, yearPrev, compare, series, range, upcoming, firstReal,
    setup, configured: () => !!state.setup, rawSetup: () => clone(state.rawSetup), stream: S, builtins, kinds: KINDS, defaults: DEFAULTS,
    custom: () => state.custom,
    sample: () => state.sample,
    setSample(on) { state.sample = !!on; tzReset(); changed(); },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    leaveTypes: () => ((S('job') || {}).leaveTypes || DEFAULT_LEAVE),
    leaveName: (code) => { const t = ((S('job') || {}).leaveTypes || DEFAULT_LEAVE).find((x) => x.code === code); return t ? t.name : code === 'PH' ? 'Public holiday' : code; },
    rules: { workedMin, deduct, jobPay, sessionMin, gigFee, hourlyMin, hourlyPay, payoutPeriod, weekdays, gigClaim, dayMinutes },
    nowTime: () => fmtTime.format(new Date()), todayLive: () => today(),
    profile: () => state.profile,
    sync: () => state.sync, setSync(p) { Object.assign(state.sync, p); emit(); },
    setRemote(r) { remote = r; }, hasRemote: () => !!remote,
    setPersist(fn) { persist = fn; }, exportLocal, importLocal, exportAll, hydrate, ingestForm,
    form: (k, kind) => (state.months[k] && state.months[k].job && state.months[k].job[kind]) || null,
    venues() { const v = new Set(); const G = S('gig'); if (G && G.venue) v.add(G.venue); sessionsIn('gig').forEach((x) => x.sessions.forEach((s) => s.venue && v.add(s.venue))); return [...v]; },
    lastRate(part) {
      let r = null;
      Object.keys(state.months).sort().forEach((k) => { const s = state.months[k][part]; if (s && s.sessions.length) r = s.sessions[s.sessions.length - 1].rateCents; });
      const st = S(part);
      return r != null ? r : st && st.rateCents ? st.rateCents : null;
    },
  };
})();
</script>
<script>/* ../core/live.js */
/* Live timesheet API link for local development. Load after core/data.js.
   tools/serve.mjs puts <meta name="cf-dev-token"> into every page it serves and proxies /ts/* (adding the
   API key server-side) and /local/state. Without that meta, which is the case in Muse and in dist/*.html,
   this file does nothing: Muse's own server actions do the timesheet sync there.

   CF.live = { ready: Promise<CF.live>, available, me, status, error, local, refresh({month}) }
     status: 'off' (no dev server) | 'connecting' | 'ok' | 'error' | 'no-key'
     available: true once /ts/me answered and CF.data.setRemote() is wired
     local: true once /local/state answered and CF.data.setPersist() is wired */
(function () {
  const CF = window.CF;
  const live = { ready: null, available: false, me: null, status: 'off', error: null, local: false, refresh };
  CF.live = live;

  const meta = typeof document !== 'undefined' && document.querySelector ? document.querySelector('meta[name="cf-dev-token"]') : null;
  const TOKEN = meta && meta.getAttribute('content');
  if (!TOKEN || !CF || !CF.data || typeof fetch !== 'function') { live.ready = Promise.resolve(live); return; }

  const D = CF.data, F = CF.fmt;
  const KINDS = ['timesheet', 'leave', 'expenses'];
  const MONTH_RE = /^20[0-9]{2}-(0[1-9]|1[0-2])$/, ID_RE = /^[A-Za-z0-9_-]{1,80}$/;
  const LIMIT = { timesheet: 31, leave: 12, expenses: 26 };
  const NOUN = { timesheet: 'timesheet', leave: 'leave form', expenses: 'expense claim' };
  const ENTRY_NOUN = { timesheet: 'days', leave: 'leave entries', expenses: 'expenses' };
  const KEY_OF = { timesheet: (e) => e && e.date, leave: (e) => e && e.id, expenses: (e) => e && e.id };
  // The API rejects unknown fields (additionalProperties: false), so send exactly the schema's fields.
  const FIELDS = {
    timesheet: { date: '', start: '', end: '', breakStart: '', breakEnd: '', overtimeMinutes: 0, attendanceCode: '', privateRemarks: '' },
    leave: { id: '', type: '', from: '', to: '', days: 0, reason: '', attachmentIds: [] },
    expenses: { id: '', date: '', description: '', amountCents: 0, attachmentIds: [] },
  };
  const clean = (kind, e) => Object.fromEntries(Object.entries(FIELDS[kind]).map(([k, d]) => [k, e[k] == null ? d : e[k]]));

  /* ---------- transport ---------- */
  async function call(method, path, { json, body } = {}) {
    const headers = { 'x-cf-token': TOKEN };
    if (json !== undefined) { headers['content-type'] = 'application/json'; body = JSON.stringify(json); }
    let r;
    try { r = await fetch(path, { method, headers, body, cache: 'no-store', credentials: 'omit' }); }
    catch { return { ok: false, status: 0, data: null }; }
    let data = null;
    if ((r.headers.get('content-type') || '').includes('json')) { try { data = await r.json(); } catch { data = null; } }
    return { ok: r.ok, status: r.status, data, retryAfter: Number(r.headers.get('retry-after')) || null };
  }

  /** Plain-English message for a failed call. */
  function explain(r, kind) {
    const d = r.data || {}, msg = typeof d.error === 'string' ? d.error : '';
    const proxy = d.source === 'dev-proxy';
    if (r.status === 0) return "Can't reach the timesheet API: you look offline, or the dev server stopped. Nothing was saved.";
    if (r.status === 401 && proxy) return 'The dev server restarted, so this page lost its session. Reload the page to reconnect.';
    if (r.status === 401) return "The timesheet API didn't accept the API key. It may have expired or been revoked: make a new one on the website and put it in .env.";
    if (r.status === 403 && proxy) return 'The dev proxy blocked that request.';
    if (r.status === 403) return "This API key isn't allowed to do that. Check its scopes on the timesheet website.";
    if (r.status === 404) return msg && !/route/i.test(msg) ? `Timesheet API: ${msg}` : "That entry wasn't found on the timesheet API. It may have been deleted elsewhere.";
    if (r.status === 413) return kind === 'upload' ? 'That file is too big. Attachments can be up to 10 MB.' : 'That entry is too large to save.';
    if (r.status === 415) return kind === 'upload' ? 'Only PDF, JPEG or PNG files can be attached.' : 'The timesheet API rejected the request format.';
    if (r.status === 429) { const s = r.retryAfter || d.retryAfter; return `Too many requests to the timesheet API in the last minute. Wait ${s ? s + ' seconds' : 'a minute'} and try again.`; }
    if (r.status === 503 && proxy) return 'There is no timesheet API key in .env, so live sync is off.';
    if (r.status === 400 && /capacity|limit|maximum|too many|full/i.test(msg) && LIMIT[kind]) return limitMsg(kind);
    if (r.status === 400) return msg ? `The timesheet API rejected this: ${msg}` : 'The timesheet API rejected this entry.';
    if (r.status >= 500) return "The timesheet API had a problem, so it isn't clear whether that saved. The latest version has been loaded: check it before trying again.";
    return msg || `The timesheet API answered ${r.status}.`;
  }
  const limitMsg = (kind) => `This ${NOUN[kind]} is full: the timesheet API allows at most ${LIMIT[kind]} ${ENTRY_NOUN[kind]} a month.`;
  const readOnlyMsg = (kind, status) => `This ${NOUN[kind]} is ${String(status).replace('_', ' ')} on the timesheet API, so it is read-only. Reopen it on the website to change it.`;

  /* ---------- forms ---------- */
  /** Make sure ingestForm gets {month, kind, revision, status, data:{entries,…}, updatedAt, leaveBalances?}.
      The real API already returns exactly this; the guards only cover partial or odd responses. */
  function normalise(f, month, kind) {
    if (!f || typeof f !== 'object') return null;
    const data = f.data && typeof f.data === 'object' ? { ...f.data } : {};
    if (!Array.isArray(data.entries)) data.entries = Array.isArray(f.entries) ? f.entries : [];
    if (kind === 'leave') { if (!Array.isArray(data.allowances)) data.allowances = []; if (typeof data.otherType !== 'string') data.otherType = ''; }
    const out = { month: f.month || month, kind: f.kind || kind, revision: Number.isInteger(f.revision) ? f.revision : 0, status: f.status || 'draft', data, updatedAt: f.updatedAt == null ? null : f.updatedAt };
    if (Array.isArray(f.leaveBalances)) out.leaveBalances = f.leaveBalances;
    return out;
  }
  // Only GET leave includes leaveBalances, so a leave mutation's response is never the whole picture.
  const isFull = (f, kind) => !!f && Array.isArray(f.data.entries) && (kind !== 'leave' || Array.isArray(f.leaveBalances));
  async function getForm(month, kind) {
    const r = await call('GET', `/ts/months/${month}/${kind}`);
    if (!r.ok) return { ok: false, r };
    const form = normalise(r.data, month, kind);
    return form ? { ok: true, form } : { ok: false, r: { ...r, ok: false, status: 502 } };
  }

  /* ---------- remote for CF.data.setRemote ---------- */
  async function write({ kind, month, op, id, entry, expectedRevision }) {
    if (!KINDS.includes(kind) || !MONTH_RE.test(month || '')) return { ok: false, error: 'Unknown timesheet form.' };
    if (!ID_RE.test(String(id || ''))) return { ok: false, error: 'That entry has an ID the timesheet API cannot store (letters, digits, - and _ only, up to 80).' };
    if (op !== 'put' && op !== 'delete') return { ok: false, error: 'Unknown change.' };
    let payload;
    if (op === 'put') {
      if (!entry || typeof entry !== 'object') return { ok: false, error: 'Nothing to save.' };
      payload = clean(kind, entry);
      if (KEY_OF[kind](payload) !== id) return { ok: false, error: kind === 'timesheet' ? "The day's date doesn't match the entry being saved." : "The entry's ID doesn't match the entry being saved." };
      const cur = D.form(month, kind);
      if (cur && Array.isArray(cur.entries) && cur.entries.length >= LIMIT[kind] && !cur.entries.some((e) => KEY_OF[kind](e) === id)) return { ok: false, limit: true, error: limitMsg(kind) };
    }
    const path = `/ts/months/${month}/${kind}/entries/${id}`;
    const body = op === 'put' ? { expectedRevision: expectedRevision || 0, entry: payload } : { expectedRevision: expectedRevision || 0 };
    const r = await call(op === 'put' ? 'PUT' : 'DELETE', path, { json: body });

    if (r.ok) {
      let form = normalise(r.data, month, kind);
      if (!isFull(form, kind)) {
        const g = await getForm(month, kind);
        if (g.ok && (!form || g.form.revision >= form.revision)) form = g.form;
        else if (form && kind === 'leave') { const prev = D.form(month, kind); form.leaveBalances = (prev && prev.balances) || []; }
      }
      if (!form) return { ok: true }; // saved, but nothing to show: data.js re-renders and the next refresh catches up
      return { ok: true, form };
    }
    if (r.status === 409) {
      // Revision conflict or a signed form. Never retry: load the latest and let the person decide.
      const g = await getForm(month, kind);
      if (g.ok) D.ingestForm(month, kind, g.form);
      const status = g.ok ? g.form.status : null;
      if (status && status !== 'draft') return { ok: false, conflict: true, readOnly: true, error: readOnlyMsg(kind, status) };
      return { ok: false, conflict: true, error: `This ${NOUN[kind]} changed on the timesheet API since it was loaded (the website or another device). The latest version is now showing: check it and save again.`, detail: (r.data && r.data.error) || null };
    }
    if (r.status === 0 || r.status >= 500) {
      // The write may or may not have landed. Reconcile by reading; don't retry.
      const g = await getForm(month, kind);
      if (g.ok) D.ingestForm(month, kind, g.form);
      return { ok: false, uncertain: r.status !== 0, error: r.status === 0 ? explain(r, kind) : explain({ status: 500, data: null }, kind) };
    }
    return { ok: false, status: r.status, limit: r.status === 400 && /capacity|limit|maximum|too many|full/i.test((r.data && r.data.error) || ''), error: explain(r, kind) };
  }

  async function upload({ kind, month, file }) {
    if (kind !== 'leave' && kind !== 'expenses') return { ok: false, error: 'Attachments go on leave or expense entries only.' };
    if (!MONTH_RE.test(month || '')) return { ok: false, error: 'Unknown month.' };
    if (!file) return { ok: false, error: 'Choose a file first.' };
    const fd = new FormData();
    fd.append('kind', kind);
    fd.append('month', month);
    fd.append('file', file, file.name || 'attachment');
    const r = await call('POST', '/ts/attachments', { body: fd });
    if (!r.ok || !r.data || !r.data.id) return { ok: false, error: r.ok ? 'The timesheet API did not return an attachment ID.' : explain(r, 'upload') };
    return { ok: true, id: r.data.id, name: r.data.name || file.name || '', contentType: r.data.contentType, size: r.data.size };
  }

  let refreshing = null;
  /** Re-read all three forms for `month`, or for the current and previous month when no month is given. */
  function refresh({ month } = {}) {
    const months = month ? [month] : [D.now, F.addMonths(D.now, -1)];
    if (months.some((m) => !MONTH_RE.test(m))) return Promise.resolve({ ok: false, error: 'Unknown month.' });
    const key = months.join(',');
    if (refreshing && refreshing.key === key) return refreshing.p;
    D.setSync({ status: 'syncing' });
    const p = Promise.all(months.flatMap((m) => KINDS.map((k) => getForm(m, k).then((g) => ({ m, k, g }))))).then((res) => {
      res.forEach(({ m, k, g }) => g.ok && D.ingestForm(m, k, g.form));
      const bad = res.find((x) => !x.g.ok);
      if (bad) {
        const error = explain(bad.g.r, bad.k);
        D.setSync({ source: 'live', status: 'error', error });
        return { ok: false, error };
      }
      D.setSync({ source: 'live', status: 'ok', at: new Date().toISOString(), error: null });
      return { ok: true };
    }).finally(() => { if (refreshing && refreshing.p === p) refreshing = null; });
    refreshing = { key, p };
    return p;
  }

  /* ---------- local-only state (setup, sessions, your income sources, claim details) ---------- */
  // Saves are serialised and coalesced: at most one PUT in flight, and the newest state always wins.
  let saving = false, queued = null;
  async function persist(obj) {
    queued = obj;
    if (saving) return;
    saving = true;
    while (queued) {
      const o = queued; queued = null;
      const r = await call('PUT', '/local/state', { json: o });
      live.localError = r.ok ? null : explain(r, 'local');
    }
    saving = false;
  }

  /* ---------- boot ---------- */
  live.status = 'connecting';
  live.ready = (async () => {
    try {
      const ls = await call('GET', '/local/state');
      if (ls.ok) { if (ls.data) D.importLocal(ls.data); D.setPersist(persist); live.local = true; }

      const me = await call('GET', '/ts/me');
      if (!me.ok) {
        live.status = me.status === 503 ? 'no-key' : 'error';
        live.error = explain(me, 'me');
        if (live.status === 'error') D.setSync({ status: 'error', error: live.error }); // no key just means no live sync: stay a quiet preview
        return live;
      }
      live.me = me.data;
      live.available = true;
      D.setRemote({ write, upload, refresh });

      const r = await refresh();
      live.status = r.ok ? 'ok' : 'error';
      live.error = r.ok ? null : r.error;
    } catch (e) {
      live.status = 'error';
      live.error = 'Live sync failed to start.';
    }
    return live;
  })();
})();
</script>
<script>/* ../core/muse.js */
/* Muse bridge. Load after core/data.js and core/live.js.

   Inside a Muse space every server action is a POST to ./actions with {action, args, actionCallId}. Muse's
   frame tunnels it to the space's backend and the answer comes back as {data} or {error}. This file:
     1. loads everything in ONE call at start (loadAll), so the first paint already has your data and the
        app never fires a request per month;
     2. sends every write in CF.actions to Muse first, and only changes the screen once Muse says ok
        (then applies it locally, so there's no second round trip);
     3. reloads quietly when you come back to the space after a while;
     4. does nothing outside Muse: a local preview, the dev server (which has its own proxy) or a file:// open.

   CF.muse = { ready: Promise<CF.muse>, active, error, call(action, args), reload(months?) }
   The full contract (setup schema, every action and its shape) is in docs/MUSE.md. */
(function () {
  const CF = window.CF, D = CF.data, F = CF.fmt;
  const muse = { ready: null, active: false, error: null, call, reload };
  CF.muse = muse;

  const dev = !!document.querySelector('meta[name="cf-dev-token"]');
  if (dev || location.protocol === 'file:' || typeof fetch !== 'function') { muse.ready = Promise.resolve(muse); return; }

  /* ---------- transport (the same request Muse's own generated spaces make) ---------- */
  function endpoint() {
    try { const u = new URL(location.href); u.hash = ''; u.search = ''; return new URL('./actions', u).toString(); }
    catch (_) { return './actions'; }
  }
  let seq = 0;
  const timeout = (ms, what) => new Promise((_, no) => setTimeout(() => no(new Error(`${what} took too long. Check your connection and try again.`)), ms));
  async function call(action, args = {}, { wait = 20000 } = {}) {
    const id = `cf-${Date.now().toString(36)}-${(++seq).toString(36)}`;
    const res = await Promise.race([
      fetch(endpoint(), { method: 'POST', headers: { 'content-type': 'application/json', 'x-request-id': id }, body: JSON.stringify({ action, args: args || {}, actionCallId: id }) }),
      timeout(wait, action === 'loadAll' ? 'Loading' : 'Saving'),
    ]);
    if (!(res.headers.get('content-type') || '').includes('json')) throw Object.assign(new Error(`No actions endpoint (${res.status})`), { noEndpoint: true });
    const j = await res.json();
    if (j && typeof j === 'object' && 'error' in j && j.error) throw new Error(typeof j.error === 'string' ? j.error : j.error.message || `${action} failed`);
    if (!res.ok) throw new Error(`${action} failed (${res.status})`);
    return j && typeof j === 'object' && 'data' in j ? j.data : j;
  }

  /* ---------- loading ---------- */
  // Three years back covers year-on-year; one month ahead lets you plan leave.
  const span = () => ({ from: F.addMonths(D.now, -35), to: F.addMonths(D.now, 1) });
  let lastLoad = 0, loading = null;
  /** Re-read from Muse: the usual window, or just the given months. Concurrent calls share one request. */
  function reload(months) {
    const args = months && months.length ? { from: months.slice().sort()[0], to: months.slice().sort().pop() } : span();
    const key = `${args.from}|${args.to}`;
    if (loading && loading.key === key) return loading.p;
    const p = call('loadAll', args).then((d) => { lastLoad = Date.now(); D.hydrate(d); muse.error = null; return d; })
      .finally(() => { if (loading && loading.p === p) loading = null; });
    loading = { key, p };
    return p;
  }

  /* ---------- writes: Muse first, then the screen ---------- */
  const WRITES = ['saveSetup', 'saveProfile', 'saveGigSession', 'deleteGigSession', 'saveHourlySession', 'deleteHourlySession',
    'saveWorkEntry', 'deleteWorkEntry', 'saveLeaveEntry', 'deleteLeaveEntry', 'saveExpenseEntry', 'deleteExpenseEntry',
    'saveIncomeSource', 'deleteIncomeSource', 'saveIncomeEntry', 'deleteIncomeEntry'];
  const FORMS = new Set(['saveWorkEntry', 'deleteWorkEntry', 'saveLeaveEntry', 'deleteLeaveEntry', 'saveExpenseEntry', 'deleteExpenseEntry']);
  const toBase64 = (file) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('That file could not be read.')); r.readAsDataURL(file); });

  function wire() {
    const A = CF.actions, mem = { ...A };
    for (const name of WRITES) {
      A[name] = async (args = {}) => {
        let r;
        try { r = await call(name, args); } catch (e) { return { ok: false, error: e.message || 'Muse could not save that.' }; }
        if (r && r.ok === false) return r;
        await mem[name](args);
        if (r && typeof r === 'object' && (r.months || 'setup' in r)) D.hydrate(r); // the backend sent fresh data back
        else if (FORMS.has(name) && args.month) reload([args.month]).catch(() => {}); // pick up the new revision and status
        return { ...(r && typeof r === 'object' ? r : {}), ok: true };
      };
    }
    A.uploadAttachment = async ({ kind, month, file }) => {
      if (!file) return { ok: false, error: 'Choose a file first.' };
      if (file.size > 10 * 1024 * 1024) return { ok: false, error: 'Attachments can be up to 10 MB.' };
      try {
        const r = await call('uploadAttachment', { kind, month, name: file.name || 'attachment', type: file.type || '', base64: await toBase64(file) }, { wait: 60000 });
        return r && r.id ? { ...r, ok: true } : { ok: false, error: (r && r.error) || 'Muse did not return an attachment id.' };
      } catch (e) { return { ok: false, error: e.message }; }
    };
    A.refresh = async ({ month } = {}) => {
      D.setSync({ status: 'syncing' });
      try {
        const r = await call('refresh', { month: month || D.now }, { wait: 45000 });
        if (r && typeof r === 'object' && r.months) { lastLoad = Date.now(); D.hydrate(r); } else await reload();
        D.setSync({ status: 'ok', at: new Date().toISOString(), error: null });
        return { ok: true };
      } catch (e) { D.setSync({ status: 'error', error: e.message }); return { ok: false, error: e.message }; }
    };
    muse.claimTemplate = async () => { const r = await call('getClaimTemplate', {}, { wait: 30000 }); return typeof r === 'string' ? r : r && r.base64; };
  }

  /* ---------- start ---------- */
  muse.ready = (async () => {
    try {
      const d = await call('loadAll', span(), { wait: 15000 });
      muse.active = true; wire();
      lastLoad = Date.now();
      D.hydrate(d);
      D.setSync({ source: 'muse', status: 'ok', at: (d && d.syncedAt) || new Date().toISOString(), error: null });
    } catch (e) {
      if (e.noEndpoint || (e && e.name === 'TypeError')) return muse; // not inside Muse: stay a local preview
      // Inside Muse, but loadAll failed (or the space doesn't have it yet): writes still go to Muse.
      muse.active = true; muse.error = e.message; wire();
      D.setSync({ source: 'muse', status: 'error', error: `Couldn't load from Muse: ${e.message}` });
    }
    return muse;
  })();

  // Back in the space after a minute or more (Muse keeps spaces alive in the background): refresh quietly.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !muse.active || Date.now() - lastLoad < 60000) return;
    reload().then(() => D.setSync({ status: 'ok', at: new Date().toISOString(), error: null })).catch(() => {});
  });
})();
</script>
<script>/* ../core/xlsx.js */
/* Excel export → CF.xlsx. Classic script, no dependencies, no network.
   gigClaim fills YOUR claim form when the setup describes one (streams.gig.claimForm: which cell takes
   what) and the space has the template (Muse action getClaimTemplate, or core/templates.local.js in dev).
   It edits the sheet XML in place, so every style, merge, drawing and column width survives. Without a
   template it builds a clean claim workbook instead, as job / hourly / statement always do.
   Zip in and out uses the browser's (De)CompressionStream('deflate-raw'); CRC32 is computed here.
   Money in the data layer is integer cents: it becomes dollars only when written into a cell. */
(function () {
  const CF = window.CF, F = CF.fmt;
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const enc = new TextEncoder(), dec = new TextDecoder();

  /* ---------- zip ---------- */
  const CRC = new Uint32Array(256).map((_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xedb88320 ^ (n >>> 1) : n >>> 1; return n; });
  const crc32 = (b) => { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
  const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

  /** Parse a zip's central directory → Map(name → {method, crc, usize, raw}); raw = the entry's compressed bytes, untouched. */
  function unzip(buf) {
    const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let e = buf.length - 22;
    while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Template is not a zip file');
    const out = new Map();
    for (let i = 0, p = v.getUint32(e + 16, true), n = v.getUint16(e + 10, true); i < n; i++) {
      const nl = v.getUint16(p + 28, true), lo = v.getUint32(p + 42, true);
      const start = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
      out.set(dec.decode(buf.subarray(p + 46, p + 46 + nl)), { method: v.getUint16(p + 10, true), crc: v.getUint32(p + 16, true), usize: v.getUint32(p + 24, true), raw: buf.subarray(start, start + v.getUint32(p + 20, true)) });
      p += 46 + nl + v.getUint16(p + 30, true) + v.getUint16(p + 32, true);
    }
    return out;
  }
  async function readText(z, name) {
    const f = z.get(name);
    if (!f) throw new Error(`Template has no ${name}`);
    if (f.method !== 0 && f.method !== 8) throw new Error(`Unsupported zip method ${f.method} for ${name}`);
    return dec.decode(f.method ? await pipe(f.raw, new DecompressionStream('deflate-raw')) : f.raw);
  }

  /** Build a zip Blob. entries: [name, string | Uint8Array | unzip() entry (copied as-is, no recompression)] */
  async function zip(entries) {
    const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const files = [], dir = [];
    let off = 0;
    for (const [name, src] of entries) {
      let f = src;
      if (!src.raw) {
        const data = typeof src === 'string' ? enc.encode(src) : src;
        f = { method: 8, crc: crc32(data), usize: data.length, raw: await pipe(data, new CompressionStream('deflate-raw')) };
      }
      const nm = enc.encode(name), lh = new Uint8Array(30), lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true); lv.setUint16(8, f.method, true);
      lv.setUint16(10, time, true); lv.setUint16(12, date, true); lv.setUint32(14, f.crc, true);
      lv.setUint32(18, f.raw.length, true); lv.setUint32(22, f.usize, true); lv.setUint16(26, nm.length, true);
      const ch = new Uint8Array(46), cv = new DataView(ch.buffer); // central header repeats local bytes 4–29 at 6–31
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); ch.set(lh.subarray(4, 30), 6); cv.setUint32(42, off, true);
      files.push(lh, nm, f.raw); dir.push(ch, nm);
      off += 30 + nm.length + f.raw.length;
    }
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
    ev.setUint32(12, dir.reduce((t, b) => t + b.length, 0), true); ev.setUint32(16, off, true);
    return new Blob([...files, ...dir, end], { type: MIME });
  }

  /* ---------- cells ---------- */
  const esc = (s) => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const colName = (i) => { let s = ''; for (i++; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s; return s; }; // 0 → A
  const colIndex = (ref) => [...ref.match(/^[A-Z]+/)[0]].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0);
  const serial = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
  const round2 = (x) => Math.round(x * 100) / 100;
  const dow = (ymd) => F.DOW[F.parseYmd(ymd).getDay()];
  /** One <c>: numbers → <v>, text → inline string (so sharedStrings.xml never changes). */
  const cellXml = (ref, v, s) => `<c r="${ref}"${s == null ? '' : ` s="${s}"`}${typeof v === 'number' ? `><v>${v}</v>` : ` t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is>`}</c>`;

  /* ---------- Gig claim, on your own template ---------- */
  const ampm = (t) => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${F.pad2(m)} ${h < 12 ? 'AM' : 'PM'}`; };
  const safeName = (s) => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  const fileName = (pattern, vars) => safeName(String(pattern).replace(/\{(\w+)\}/g, (_, k) => (vars[k] == null ? '' : vars[k]))) + (/\.xlsx$/i.test(pattern) ? '' : '.xlsx');

  /** Replace (or insert, in column order) the given cells inside their rows. cells: {ref: [value, s]} */
  function putCells(xml, cells) {
    const rows = {};
    for (const [ref, c] of Object.entries(cells)) (rows[ref.replace(/^[A-Z]+/, '')] ||= []).push([ref, c]);
    xml = xml.replace(/<row r="(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g, (m, r, attrs, body = '') => {
      if (!rows[r]) return m;
      for (const [ref, [v, s]] of rows[r]) {
        const c = cellXml(ref, v, s), re = new RegExp(`<c r="${ref}"[^>]*?(?:/>|>[\\s\\S]*?</c>)`);
        if (re.test(body)) { body = body.replace(re, () => c); continue; }
        const next = [...body.matchAll(/<c r="([A-Z]+)\d+"/g)].find((x) => colIndex(x[1]) > colIndex(ref));
        body = next ? body.slice(0, next.index) + c + body.slice(next.index) : body + c;
      }
      delete rows[r];
      return `<row r="${r}"${attrs}>${body}</row>`;
    });
    if (Object.keys(rows).length) throw new Error(`The claim template has no row ${Object.keys(rows).join(', ')}`);
    return xml;
  }

  let templateCache = null;
  async function claimTemplate() {
    if (CF.templates && CF.templates.claim) return CF.templates.claim;
    if (templateCache) return templateCache;
    if (CF.muse && CF.muse.active && CF.muse.claimTemplate) templateCache = await CF.muse.claimTemplate().catch(() => null);
    return templateCache;
  }

  /** form = setup.streams.gig.claimForm: {sheet?, header:{name,bank,paymentId,month}, rows:{first,count},
      columns:{date,day,venue,timeIn,timeOut,sessions,hours,rate,fee,remarks}, totals:{row,hours,fee},
      rate:'hourly'|'session', time:'12h'|'24h', filename}. Every key is optional except rows.first. */
  async function fillTemplate(k, form, b64) {
    const m = CF.data.month(k), R = CF.data.rules, G = CF.data.stream('gig'), p = CF.data.profile() || {}, warnings = [];
    const z = unzip(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
    const SHEET = form.sheet || 'xl/worksheets/sheet1.xml', BOOK = 'xl/workbook.xml';
    const [sheet, wb, styles] = await Promise.all([SHEET, BOOK, 'xl/styles.xml'].map((n) => readText(z, n)));
    const FIRST = +form.rows.first, LINES = +(form.rows.count || 30);
    const col = form.columns || {}, head = form.header || {}, tot = form.totals || {};

    // Keep every cell's own style. Where a row's cell has a plain "General" style but gets a date or money,
    // borrow the first line's style for that column (same font/border/fill, only the number format differs).
    const S = Object.fromEntries([...sheet.matchAll(/<c r="([A-Z]+\d+)"([^>]*?)\/?>/g)].map((x) => [x[1], (x[2].match(/\bs="(\d+)"/) || [])[1]]));
    const numFmt = [...styles.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/)[1].matchAll(/<xf\b[^>]*/g)].map((x) => +((x[0].match(/numFmtId="(\d+)"/) || [])[1] || 0));
    const cells = {};
    const put = (ref, v, formatted) => {
      if (!ref || v == null || v === '') return;
      const base = S[ref.replace(/\d+$/, FIRST)], s = ref in S ? S[ref] : base;
      cells[ref] = [v, formatted && !numFmt[s] ? base : s];
    };

    const name = String(p.fullName || '').trim(), bank = String(p.bankAccount || '').trim(), payId = String(p.paymentId || '').trim();
    put(head.bank, bank); put(head.name, name); put(head.paymentId, payId); put(head.month, serial(`${k}-01`));
    if (head.name && !name) warnings.push('No full name in your claim details, so that line is blank.');
    if (head.bank && !bank) warnings.push('No bank account in your claim details, so that line is blank.');
    if (head.paymentId && !payId) warnings.push(`No ${CF.data.setup().paymentIdLabel} in your claim details, so that line is blank.`);

    const all = m.gig.sessions, lines = all.slice(0, LINES);
    if (!all.length) warnings.push(`No sessions logged for ${m.label}.`);
    if (all.length > LINES) {
      const rest = all.slice(LINES);
      warnings.push(`The form has ${LINES} lines but ${m.label} has ${all.length} entries: the last ${rest.length} (${F.money(F.sum(rest, R.gigFee), { cents: true })}) are not on it and need a second form.`);
    }
    const t12 = form.time !== '24h', unit = G.sessionMinutes / 60;
    let hours = 0, fees = 0;
    lines.forEach((s, i) => {
      const r = FIRST + i, n = s.sessionsCount || 1, std = G.sessionMinutes * n, span = R.sessionMin(s);
      const h = round2((span && span !== std ? span : std) / 60); // the standard length unless the logged times say otherwise
      const at = (c) => (c ? `${c}${r}` : null);
      put(at(col.date), serial(s.date), true); put(at(col.day), dow(s.date)); put(at(col.venue), s.venue);
      put(at(col.timeIn), s.timeIn && (t12 ? ampm(s.timeIn) : s.timeIn)); put(at(col.timeOut), s.timeOut && (t12 ? ampm(s.timeOut) : s.timeOut));
      put(at(col.sessions), n); put(at(col.hours), h);
      put(at(col.rate), form.rate === 'hourly' ? s.rateCents / 100 / unit : s.rateCents / 100, true);
      put(at(col.fee), R.gigFee(s) / 100, true); put(at(col.remarks), s.remarks);
      hours += h; fees += R.gigFee(s);
    });
    if (tot.row) { put(tot.hours && `${tot.hours}${tot.row}`, round2(hours)); put(tot.fee && `${tot.fee}${tot.row}`, fees / 100); }

    const edits = {
      // Open at the top of the form, and recalculate any formulas on open.
      [SHEET]: putCells(sheet.replace(/(<sheetView\b[^>]*?) topLeftCell="[^"]*"/, '$1'), cells),
      [BOOK]: /<calcPr\b/.test(wb)
        ? wb.replace(/<calcPr\b([^>]*?)\s*\/>/, (_, a) => `<calcPr${a.replace(/\s+fullCalcOnLoad="[^"]*"/, '')} fullCalcOnLoad="1"/>`)
        : wb.replace(/(<\/sheets>(?:\s*<definedNames>[\s\S]*?<\/definedNames>)?)/, '$1<calcPr fullCalcOnLoad="1"/>'),
    };
    if (z.has('xl/calcChain.xml')) {
      edits['[Content_Types].xml'] = (await readText(z, '[Content_Types].xml')).replace(/<Override[^>]*PartName="\/xl\/calcChain\.xml"[^>]*\/>/, '');
      edits['xl/_rels/workbook.xml.rels'] = (await readText(z, 'xl/_rels/workbook.xml.rels')).replace(/<Relationship[^>]*Target="[^"]*calcChain\.xml"[^>]*\/>/, '');
    }
    const blob = await zip([...z.keys()].filter((n) => n !== 'xl/calcChain.xml').map((n) => [n, n in edits ? edits[n] : z.get(n)]));
    const filename = fileName(form.filename || `${G.label} claim - {name} - {month}`, { name: name || 'Claim', month: m.label, label: G.label });
    return { blob, filename, warnings };
  }

  /* ---------- Clean workbooks from scratch ---------- */
  // Cell = [value, style]; value null/'' leaves a styled blank. Styles: h header · t text · d date · tm time
  // · m money · hr hours, bold variants tB mB hrB for totals, L a bold label without a border.
  const XF = [['', 0, 0, 0], ['h', 0, 1, 1, 1], ['t', 0, 0, 1], ['d', 164, 0, 1], ['tm', 20, 0, 1], ['m', 165, 0, 1], ['hr', 2, 0, 1],
    ['tB', 0, 1, 1], ['mB', 165, 1, 1], ['hrB', 2, 1, 1], ['L', 0, 1, 0]];
  const XFI = Object.fromEntries(XF.map((x, i) => [x[0], i]));
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const NS = 'http://schemas.openxmlformats.org';
  const MAIN = `${NS}/spreadsheetml/2006/main`, REL = `${NS}/officeDocument/2006/relationships`;
  const edge = (side) => `<${side} style="thin"><color rgb="FFBFBFBF"/></${side}>`;
  const STYLES = `${XML}<styleSheet xmlns="${MAIN}">`
    + '<numFmts count="2"><numFmt numFmtId="164" formatCode="d mmm yyyy"/><numFmt numFmtId="165" formatCode="$#,##0.00"/></numFmts>'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts>'
    + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF0F0F0"/><bgColor indexed="64"/></patternFill></fill></fills>'
    + `<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${['left', 'right', 'top', 'bottom'].map(edge).join('')}<diagonal/></border></borders>`
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + `<cellXfs count="${XF.length}">${XF.map(([, fmt, b, bd, fill]) => `<xf numFmtId="${fmt}" fontId="${b}" fillId="${fill ? 2 : 0}" borderId="${bd}" xfId="0"${fmt ? ' applyNumberFormat="1"' : ''}${b ? ' applyFont="1"' : ''}${fill ? ' applyFill="1"' : ''}${bd ? ' applyBorder="1"' : ''}/>`).join('')}</cellXfs>`
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  const hdr = (names) => names.map((n) => [n, 'h']);
  const txt = (v, b) => [v == null ? '' : String(v), b ? 'tB' : 't'];
  const num = (v, b) => [v, b ? 'tB' : 't'];
  const date = (ymd) => [ymd ? serial(ymd) : null, 'd'];
  const time = (t) => [t ? F.toMin(t) / 1440 : null, 'tm'];
  const money = (cents, b) => [cents == null ? null : cents / 100, b ? 'mB' : 'm'];
  const hrs = (min, b) => [min == null ? null : min / 60, b ? 'hrB' : 'hr'];
  const blank = (style, n = 1) => Array.from({ length: n }, () => [null, style]);

  /** {cols:[widths], rows:[[cell]], merges?:['A1:B1'], freezeCols?:n}: header row 1 is always frozen. */
  function sheetXml({ cols, rows, merges = [], freezeCols = 0 }) {
    const tl = colName(freezeCols) + 2, pane = freezeCols ? 'bottomRight' : 'bottomLeft';
    const cell = (ref, [v, k]) => (v == null || v === '' ? (XFI[k] ? `<c r="${ref}" s="${XFI[k]}"/>` : '') : cellXml(ref, v, XFI[k] || null));
    const data = rows.map((row, r) => (row && row.length ? `<row r="${r + 1}">${row.map((c, i) => (c ? cell(colName(i) + (r + 1), c) : '')).join('')}</row>` : '')).join('');
    return `${XML}<worksheet xmlns="${MAIN}" xmlns:r="${REL}">`
      + `<sheetViews><sheetView workbookViewId="0"><pane${freezeCols ? ` xSplit="${freezeCols}"` : ''} ySplit="1" topLeftCell="${tl}" activePane="${pane}" state="frozen"/><selection pane="${pane}" activeCell="${tl}" sqref="${tl}"/></sheetView></sheetViews>`
      + `<sheetFormatPr defaultRowHeight="15"/><cols>${cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`
      + `<sheetData>${data}</sheetData>${merges.length ? `<mergeCells count="${merges.length}">${merges.map((ref) => `<mergeCell ref="${ref}"/>`).join('')}</mergeCells>` : ''}`
      + '<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>';
  }
  function book(sheets) {
    const CT = 'application/vnd.openxmlformats-officedocument.spreadsheetml', RELS = `${NS}/package/2006/relationships`;
    return zip([
      ['[Content_Types].xml', `${XML}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>`
        + `<Override PartName="/xl/workbook.xml" ContentType="${CT}.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="${CT}.styles+xml"/>`
        + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="${CT}.worksheet+xml"/>`).join('') + '</Types>'],
      ['_rels/.rels', `${XML}<Relationships xmlns="${RELS}"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `${XML}<workbook xmlns="${MAIN}" xmlns:r="${REL}"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `${XML}<Relationships xmlns="${RELS}">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', STYLES],
      ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s)]),
    ]);
  }

  /* ---------- Gig claim, as a clean workbook (when there's no template) ---------- */
  async function gigClaim(k) {
    const G = CF.data.stream('gig');
    if (!G) throw new Error('No per-session work is set up');
    const form = G.claimForm && G.claimForm.rows && G.claimForm.rows.first ? G.claimForm : null;
    if (form) {
      const b64 = await claimTemplate();
      if (b64) return fillTemplate(k, form, b64);
    }
    const m = CF.data.month(k), R = CF.data.rules, p = CF.data.profile() || {}, c = m.gig.claim;
    const rows = [
      hdr(['Date', 'Day', 'Venue', 'Time in', 'Time out', 'Sessions', 'Hours', 'Rate', 'Fee', 'Remarks']),
      ...m.gig.sessions.map((s) => [date(s.date), txt(dow(s.date)), txt(s.venue), time(s.timeIn), time(s.timeOut), num(s.sessionsCount || 1), hrs(R.sessionMin(s) || G.sessionMinutes * (s.sessionsCount || 1)), money(s.rateCents), money(R.gigFee(s)), txt(s.remarks)]),
      [txt('Total', true), ...blank('tB', 4), num(m.gig.count, true), hrs(m.gig.minutes, true), [null, 'tB'], money(m.gig.fees, true), [null, 'tB']],
      [],
      [['Claim details', 'L']],
    ];
    const details = [['Month', txt(m.long)], ['Name', txt(p.fullName)], ['Bank account', txt(p.bankAccount)], [CF.data.setup() ? CF.data.setup().paymentIdLabel : 'Payment ID', txt(p.paymentId)]];
    if (c && c.to) details.push(['Send to', txt(c.to)]);
    if (c && c.due) details.push(['Due', date(c.due)]);
    const merges = [];
    for (const [label, v] of details) { const r = rows.length + 1; rows.push([txt(label, true), [null, 'tB'], v, ...blank(v[1], 2)]); merges.push(`A${r}:B${r}`, `C${r}:E${r}`); }
    const warnings = [];
    if (form) warnings.push("This space has no claim template yet, so it's a plain claim workbook.");
    if (!p.fullName) warnings.push('Add your name in claim details to put it on the form.');
    return { blob: await book([{ name: 'Claim', cols: [12, 6, 20, 9, 9, 9, 8, 10, 10, 32], rows, merges }]), filename: fileName(`${G.label} claim - ${m.label}`, {}), warnings };
  }

  /* ---------- Job: days, leave and claims ---------- */
  async function job(k) {
    const m = CF.data.month(k), I = m.job, R = CF.data.rules, J = CF.data.stream('job');
    if (!J) throw new Error('No job is set up');
    const rows = [
      hdr(['Date', 'Day', 'Start', 'End', 'Break start', 'Break end', 'Overtime min', 'Hours', 'Code', 'Remarks']),
      ...I.entries.map((e) => [date(e.date), txt(dow(e.date)), time(e.start), time(e.end), time(e.breakStart), time(e.breakEnd), num(e.overtimeMinutes || 0), hrs(R.workedMin(e)), txt(e.attendanceCode), txt(e.privateRemarks ?? e.remarks)]),
      [txt('Total', true), ...blank('tB', 5), num(F.sum(I.entries, (e) => e.overtimeMinutes), true), hrs(I.workedMin, true), ...blank('tB', 2)],
      [],
      [['Summary', 'L']],
    ];
    const summary = [['Hours worked', hrs(I.workedMin)], ['Expected hours', hrs(I.expectedMin)], ['Full-month pay', money(I.monthlyPayCents)], ['Gross pay', money(I.gross)]];
    if (J.deduction) summary.push([J.deduction.label, money(I.deducted)]);
    summary.push(['Net pay', money(I.net, true)]);
    if (I.status) summary.push([`${J.system} status`, txt(`${I.status.replace(/_/g, ' ')} · revision ${I.revision}`)]);
    const merges = [];
    for (const [label, v] of summary) {
      const r = rows.length + 1;
      rows.push([txt(label, true), [null, 'tB'], v, ...blank(v[1], 2)]);
      merges.push(`A${r}:B${r}`, `C${r}:E${r}`);
    }
    const sheets = [{ name: 'Timesheet', cols: [12, 7, 8, 8, 11, 10, 13, 8, 7, 40], rows, merges }];

    const leave = I.leave && I.leave.entries ? [...I.leave.entries].sort((a, b) => String(a.from).localeCompare(String(b.from))) : [];
    if (leave.length) sheets.push({ name: 'Leave', cols: [8, 12, 12, 7, 44], rows: [
      hdr(['Type', 'From', 'To', 'Days', 'Reason']),
      ...leave.map((e) => [txt(e.type), date(e.from), date(e.to), num(e.days), txt(e.reason)]),
      [txt('Total', true), ...blank('tB', 2), num(F.sum(leave, (e) => e.days), true), [null, 'tB']],
    ] });
    const claims = I.claims && I.claims.entries ? [...I.claims.entries].sort((a, b) => String(a.date).localeCompare(String(b.date))) : [];
    if (claims.length) sheets.push({ name: 'Claims', cols: [12, 44, 12], rows: [
      hdr(['Date', 'Description', 'Amount']),
      ...claims.map((e) => [date(e.date), txt(e.description), money(e.amountCents)]),
      [txt('Total', true), [null, 'tB'], money(F.sum(claims, (e) => e.amountCents), true)],
    ] });
    return { blob: await book(sheets), filename: fileName(`${J.short} hours - ${m.label}`, {}) };
  }

  /* ---------- Hourly work ---------- */
  async function hourly(k) {
    const m = CF.data.month(k), R = CF.data.rules, H = CF.data.stream('hourly');
    if (!H) throw new Error('No hourly work is set up');
    const rows = [
      hdr(['Date', 'Day', H.unitLabel, 'Time in', 'Time out', 'Hours', 'Rate', 'Pay', 'Remarks']),
      ...m.hourly.sessions.map((s) => [date(s.date), txt(dow(s.date)), txt(s.module), time(s.timeIn), time(s.timeOut), hrs(R.hourlyMin(s)), money(s.rateCents), money(R.hourlyPay(s)), txt(s.remarks)]),
      [txt('Total', true), ...blank('tB', 4), hrs(m.hourly.minutes, true), [null, 'tB'], money(m.hourly.pay, true), [null, 'tB']],
    ];
    return { blob: await book([{ name: `${H.short} log`.slice(0, 31), cols: [12, 6, 14, 9, 9, 8, 10, 10, 32], rows }]), filename: fileName(`${H.short} log - ${m.label}`, {}) };
  }

  /* ---------- Yearly cashflow statement ---------- */
  async function statement(y) {
    const Y = CF.data.year(y), months = Y.months;
    const ok = (m) => m && m.expenses.status === 'ok';
    const total = (vals) => (vals.some((v) => v != null) ? F.sum(vals) : null); // a column of blanks totals to blank, not $0

    const ov = months.map((m, i) => {
      if (!m) return { label: F.monthLabel(F.monthKey(y, i)), vals: [null, null, null, null, null], note: '' };
      const sch = m.lumpsum.amount;
      return { label: m.label, vals: [m.income, sch, m.income - sch, ok(m) ? m.expenses.total : null, m.net], note: m.isSample ? 'Sample data' : ok(m) ? '' : 'Spending not synced' };
    });
    const L = CF.data.stream('lumpsum'), lname = L ? L.label : 'yearly payment';
    const overview = [
      hdr(['Month', 'Income', `of which ${lname}`, `Income excl. ${lname}`, 'Spent', 'Net', 'Note']),
      ...ov.map((o) => [txt(o.label), ...o.vals.map((v) => money(v)), txt(o.note)]),
      [txt('Total', true), ...[0, 1, 2, 3, 4].map((j) => money(total(ov.map((o) => o.vals[j])), true)), [null, 'tB']],
    ];

    const monthHdr = (first) => hdr([first, ...F.MONTHS, 'Total']);
    const income = [
      monthHdr('Stream'),
      ...Y.streams.map((s) => [txt(s.label), ...s.monthly.map((v) => money(v)), money(s.amount)]),
      [txt('Total', true), ...months.map((m) => money(m ? m.income : null, true)), money(Y.income, true)],
    ];
    const spending = [
      monthHdr('Category'),
      ...Y.expenses.categories.map((c) => [txt(c.name), ...months.map((m) => money(ok(m) ? (m.expenses.categories.find((x) => x.name === c.name) || { amount: 0 }).amount : null)), money(c.amount)]),
      [txt('Total', true), ...months.map((m) => money(ok(m) ? m.expenses.total : null, true)), money(total(months.map((m) => (ok(m) ? m.expenses.total : null))), true)],
    ];
    const wide = (first) => [first, ...Array(12).fill(10), 12];
    return {
      blob: await book([
        { name: 'Overview', cols: [11, 12, 24, 24, 12, 12, 20], rows: overview },
        { name: 'Income', cols: wide(22), rows: income, freezeCols: 1 },
        { name: 'Spending', cols: wide(22), rows: spending, freezeCols: 1 },
      ]),
      filename: `Cashflow ${y}.xlsx`,
    };
  }

  /** Save a {blob, filename} (Muse spaces allow downloads). */
  function download({ blob, filename }) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  CF.xlsx = { gigClaim, job, hourly, statement, download };
})();
</script>
<script>/* ../core/viz.js */
/* Shared SVG charts. No dependencies, no external assets (Muse spaces can't load CDNs).
   Every chart takes colours as CSS strings (e.g. 'var(--s-gig)') so each design keeps its own palette,
   re-renders on resize, and respects prefers-reduced-motion. */
(function () {
  const CF = window.CF, F = CF.fmt;
  const NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs || {}) if (attrs[k] != null && attrs[k] !== false) el.setAttribute(k, attrs[k]);
    kids.flat().forEach((c) => c != null && el.append(c instanceof Node ? c : document.createTextNode(String(c))));
    return el;
  }
  /** Attach a renderer to an element; re-run on width change. Returns {update(opts), destroy()} */
  function responsive(el, render, opts) {
    let last = 0, cur = opts, first = true;
    const run = () => { const w = Math.round(el.clientWidth); if (!w) return; last = w; el.replaceChildren(render(w, cur, first)); first = false; };
    const ro = new ResizeObserver(() => { if (Math.round(el.clientWidth) !== last) run(); });
    ro.observe(el); run();
    return { update(o) { cur = { ...cur, ...o }; run(); }, destroy() { ro.disconnect(); }, el };
  }
  const anim = (first) => first && !F.reducedMotion();

  /* ---------------- Sankey: sources → centre → outflows ---------------- */
  function sankey(el, opts) { return responsive(el, sankeySvg, opts); }
  function sankeySvg(W, o, first) {
    const fmt = o.fmt || ((v) => F.money(v));
    const compact = W < 560;
    const nodeW = o.nodeW || (compact ? 8 : 12);
    let src = o.sources.filter((n) => n.value > 0).map((n) => ({ ...n, side: 'L' }));
    let out = o.outflows.filter((n) => n.value > 0).map((n) => ({ ...n, side: 'R' }));
    const sumL = F.sum(src, (n) => n.value), sumR = F.sum(out, (n) => n.value);
    if (o.pending) out = [{ id: 'pending', label: o.pendingLabel || 'Expenses syncing…', value: Math.max(sumL, 1), kind: 'pending', side: 'R' }];
    else if (sumR > sumL) src.push({ id: 'from-savings', label: o.deficitLabel || 'From savings', value: sumR - sumL, kind: 'deficit', side: 'L', sub: 'covers the gap' });
    else if (sumL > sumR) out.push({ id: 'kept', label: o.surplusLabel || 'Kept', value: sumL - sumR, kind: 'save', side: 'R' });
    const T = Math.max(F.sum(src, (n) => n.value), F.sum(out, (n) => n.value), 1);
    const nMax = Math.max(src.length, out.length, 1);
    const minGap = compact ? 30 : 36;
    const gap = compact ? 8 : 12;
    const top0 = compact ? 46 : 56; // room for the centre label
    const H = Math.max(o.height || (compact ? 230 : 300), nMax * minGap + 8);
    const labelL = o.labelL || (compact ? Math.min(98, W * 0.27) : 170);
    const labelR = o.labelR || (compact ? Math.min(112, W * 0.31) : 190);
    const xL = labelL, xC = W / 2 - nodeW / 2, xR = W - labelR - nodeW;
    const fill = o.fill || 1; // < 1 draws thinner ribbons and spreads the nodes over the height
    const k = ((H - gap * (nMax - 1)) * fill) / T;
    const maxGap = o.maxGap || (compact ? 22 : 30);
    // thin ribbons leave the centre bar short: pull everything up so the centre label isn't floating in empty space
    const top = fill < 1 ? Math.max(18, top0 - (H - T * k) / 2) : top0;
    const place = (nodes) => {
      nodes.forEach((n) => { n.h = Math.max(1.5, n.value * k); });
      const sumH = F.sum(nodes, (n) => n.h);
      const g = fill < 1 && nodes.length > 1 ? Math.min(maxGap, Math.max(gap, (H - sumH) / (nodes.length - 1))) : gap;
      let y = top + (H - sumH - g * (nodes.length - 1)) / 2;
      nodes.forEach((n) => { n.y = y; y += n.h + g; });
    };
    place(src); place(out);
    const cH = T * k, cY = top + (H - cH) / 2;
    const color = (n) => n.color || (n.kind === 'deficit' ? 'var(--sk-deficit, #c56b5a)' : n.kind === 'save' ? 'var(--sk-save, #4e9a51)' : n.kind === 'pending' ? 'var(--dim, #888)' : 'var(--accent, #4b7bec)');
    const svg = s('svg', { class: 'cf-sk' + (anim(first) ? ' cf-enter' : ''), viewBox: `0 0 ${W} ${H + top + 8}`, width: W, height: H + top + 8, role: 'img', 'aria-label': o.ariaLabel || 'Money flow: income sources into total income, then out to spending, investments and savings' });
    const defs = s('defs');
    svg.append(defs);
    const flows = s('g', { class: 'cf-sk-flows' });
    const nodesG = s('g', { class: 'cf-sk-nodes' });
    const labels = s('g', { class: 'cf-sk-labels' });
    svg.append(flows, nodesG, labels);
    const ribbon = (x0, y0, x1, y1, h) => { const m = (x1 - x0) / 2; return `M${x0} ${y0}C${x0 + m} ${y0},${x1 - m} ${y1},${x1} ${y1}L${x1} ${y1 + h}C${x1 - m} ${y1 + h},${x0 + m} ${y0 + h},${x0} ${y0 + h}Z`; };
    let off = cY, i = 0;
    for (const n of src) {
      const gid = `g${Math.random().toString(36).slice(2, 8)}`;
      defs.append(s('linearGradient', { id: gid, x1: 0, x2: 1 }, s('stop', { offset: 0, 'stop-color': color(n), 'stop-opacity': n.kind === 'deficit' ? 0.3 : 0.42 }), s('stop', { offset: 1, 'stop-color': color(n), 'stop-opacity': 0.16 })));
      flows.append(s('path', { class: 'cf-sk-flow' + (n.kind === 'deficit' ? ' is-deficit' : ''), 'data-id': n.id, d: ribbon(xL + nodeW, n.y, xC, off, n.h), fill: `url(#${gid})`, style: `--i:${i++}` }));
      off += n.h;
    }
    off = cY;
    for (const n of out) {
      const gid = `g${Math.random().toString(36).slice(2, 8)}`;
      defs.append(s('linearGradient', { id: gid, x1: 0, x2: 1 }, s('stop', { offset: 0, 'stop-color': color(n), 'stop-opacity': 0.14 }), s('stop', { offset: 1, 'stop-color': color(n), 'stop-opacity': n.kind === 'pending' ? 0.12 : 0.42 })));
      flows.append(s('path', { class: 'cf-sk-flow' + (n.kind === 'pending' ? ' is-pending' : ''), 'data-id': n.id, d: ribbon(xC + nodeW, off, xR, n.y, n.h), fill: `url(#${gid})`, style: `--i:${i++}` }));
      off += n.h;
    }
    const allNodes = [...src, ...out];
    for (const n of allNodes) nodesG.append(s('rect', { class: 'cf-sk-node' + (n.kind ? ' is-' + n.kind : ''), 'data-id': n.id, x: n.side === 'L' ? xL : xR, y: n.y, width: nodeW, height: n.h, rx: Math.min(3, nodeW / 3), fill: color(n) }));
    nodesG.append(s('rect', { class: 'cf-sk-node is-center', x: xC, y: cY, width: nodeW, height: cH, rx: Math.min(3, nodeW / 3), fill: o.centerColor || 'var(--text)' }));
    // labels with collision relaxation
    const relax = (nodes) => {
      const ys = nodes.map((n) => n.y + n.h / 2);
      for (let j = 1; j < ys.length; j++) if (ys[j] - ys[j - 1] < minGap) ys[j] = ys[j - 1] + minGap;
      const over = ys.length ? ys[ys.length - 1] - (top + H - 10) : 0;
      if (over > 0) { ys[ys.length - 1] -= over; for (let j = ys.length - 2; j >= 0; j--) if (ys[j + 1] - ys[j] < minGap) ys[j] = ys[j + 1] - minGap; }
      nodes.forEach((n, j) => (n.ly = ys[j]));
    };
    relax(src); relax(out);
    const trunc = (t, max) => (t.length > max ? t.slice(0, max - 1) + '…' : t);
    for (const n of allNodes) {
      const L = n.side === 'L';
      const x = L ? xL - 8 : xR + nodeW + 8;
      const anchor = L ? 'end' : 'start';
      const g = s('g', { class: 'cf-sk-label' + (n.kind ? ' is-' + n.kind : ''), 'data-id': n.id });
      const maxChars = Math.floor((L ? labelL : labelR) / (compact ? 6.4 : 7.2));
      g.append(s('text', { x, y: n.ly - 3, 'text-anchor': anchor, class: 'cf-sk-name' }, trunc(n.short && compact ? n.short : n.label, maxChars)));
      const val = s('text', { x, y: n.ly + 12, 'text-anchor': anchor, class: 'cf-sk-val' }, fmt(n.value));
      if (n.delta != null && !compact) val.append(s('tspan', { class: 'cf-sk-delta ' + (n.delta >= 0 ? 'up' : 'down'), dx: 5 }, F.pct(n.delta, { sign: true })));
      else if (n.sub && !compact) val.append(s('tspan', { class: 'cf-sk-sub', dx: 5 }, n.sub));
      g.append(val);
      if (Math.abs(n.ly - (n.y + n.h / 2)) > 4) {
        const ex = L ? xL - 2 : xR + nodeW + 2, lx = L ? xL - 6 : xR + nodeW + 6;
        g.append(s('path', { class: 'cf-sk-leader', d: `M${ex} ${n.y + n.h / 2}L${lx} ${n.ly}`, fill: 'none' }));
      }
      labels.append(g);
    }
    const c = o.center || {};
    labels.append(s('text', { x: xC + nodeW / 2, y: cY - (compact ? 24 : 30), 'text-anchor': 'middle', class: 'cf-sk-cname' }, c.label || 'Income'));
    labels.append(s('text', { x: xC + nodeW / 2, y: cY - 8, 'text-anchor': 'middle', class: 'cf-sk-cval' }, c.value != null ? fmt(c.value) : fmt(sumL)));
    // interaction: highlight a node's flows; tap to select (and again to clear)
    let sel = o.selected || null;
    const apply = (id) => {
      svg.classList.toggle('has-sel', !!id);
      svg.querySelectorAll('[data-id]').forEach((e) => e.classList.toggle('on', e.getAttribute('data-id') === id));
    };
    if (sel) apply(sel);
    svg.addEventListener('pointerover', (e) => { if (e.pointerType !== 'mouse') return; const t = e.target.closest('[data-id]'); apply(t ? t.getAttribute('data-id') : sel); });
    svg.addEventListener('pointerleave', () => apply(sel));
    svg.addEventListener('click', (e) => {
      const t = e.target.closest('[data-id]');
      const id = t ? t.getAttribute('data-id') : null;
      sel = id && id !== sel ? id : null; apply(sel);
      o.onSelect && o.onSelect(sel ? allNodes.find((n) => n.id === sel) : null);
    });
    return svg;
  }

  /* ---------------- Diverging month bars: income stacked up, spending down ---------------- */
  function bars(el, opts) { return responsive(el, barsSvg, opts); }
  function barsSvg(W, o, first) {
    const items = o.items, n = items.length, H = o.height || 180, labH = 22;
    const ups = items.map((it) => F.sum(it.stacks, (x) => x.value));
    const maxUp = Math.max(1, ...ups), maxDown = Math.max(1, ...items.map((it) => it.down || 0));
    const share = o.upOnly ? 1 : F.clamp(maxUp / (maxUp + maxDown), 0.5, 0.78);
    const base = (H - labH) * share;
    const kUp = (base - (o.valueLabel ? 22 : 8)) / maxUp, kDn = (H - labH - base - 6) / maxDown;
    const slot = W / n, bw = Math.min(o.barW || 26, slot * 0.58);
    const svg = s('svg', { class: 'cf-bars' + (anim(first) ? ' cf-enter' : ''), viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': o.ariaLabel || 'Income and spending by month' });
    svg.append(s('line', { class: 'cf-base', x1: 0, x2: W, y1: base, y2: base }));
    items.forEach((it, i) => {
      const cx = slot * i + slot / 2, x = cx - bw / 2;
      const g = s('g', { class: 'cf-bar' + (it.key === o.selected ? ' is-sel' : '') + (it.sample ? ' is-sample' : '') + (it.future ? ' is-future' : ''), 'data-key': it.key, style: `--i:${i}` });
      g.append(s('rect', { class: 'cf-hit', x: slot * i, y: 0, width: slot, height: H, fill: 'transparent' }));
      let y = base;
      const segs = it.stacks.filter((x) => x.value > 0);
      const upG = s('g', { class: 'cf-up' });
      segs.forEach((seg, j) => {
        const hh = seg.value * kUp; y -= hh;
        const last = j === segs.length - 1, r = Math.min(4, bw / 3, hh);
        upG.append(s('path', { fill: seg.color, d: last ? `M${x} ${y + hh}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + bw - r}Q${x + bw} ${y} ${x + bw} ${y + r}V${y + hh}Z` : `M${x} ${y}h${bw}v${hh}h${-bw}Z` }));
      });
      g.append(upG);
      if (it.down) {
        const hh = it.down * kDn, r = Math.min(4, bw / 3, hh);
        g.append(s('g', { class: 'cf-down' }, s('path', { fill: o.downColor || 'var(--neg)', d: `M${x} ${base + 1}H${x + bw}V${base + 1 + hh - r}Q${x + bw} ${base + 1 + hh} ${x + bw - r} ${base + 1 + hh}H${x + r}Q${x} ${base + 1 + hh} ${x} ${base + 1 + hh - r}Z` })));
      }
      if (it.net != null && o.showNet !== false) {
        const ny = it.net >= 0 ? base - it.net * kUp : base + Math.min(-it.net * kDn, H - labH - base);
        g.append(s('circle', { class: 'cf-net' + (it.net < 0 ? ' neg' : ''), cx, cy: ny, r: Math.max(2.5, Math.min(4, bw / 5)) }));
      }
      if (o.valueLabel && it.key === o.selected && ups[i] > 0) g.append(s('text', { class: 'cf-bval', x: cx, y: base - ups[i] * kUp - 7, 'text-anchor': 'middle' }, F.money(ups[i], { compact: true })));
      const lab = slot < 30 ? it.label.slice(0, 1) : it.label;
      g.append(s('text', { class: 'cf-blab', x: cx, y: H - 6, 'text-anchor': 'middle' }, lab));
      g.append(s('title', {}, `${it.title || it.label}: in ${F.money(ups[i])}, out ${F.money(it.down || 0)}`));
      svg.append(g);
    });
    svg.addEventListener('click', (e) => { const g = e.target.closest('.cf-bar'); if (g && o.onSelect) o.onSelect(g.getAttribute('data-key')); });

  /* ---------- Toast ---------- */
  let toastEl, toastT;
  function toast(msg, { action, ms = 2600 } = {}) {

  }

  /* ---------- Numbers that tick to their new value ---------- */
  function countTo(el, cents, fmt = (v) => F.money(v)) {

      goto(mode, key) { this.mode = mode; this.key = key; onChange && onChange(this); },
      view() { return this.mode === 'month' ? CF.data.month(this.key) : CF.data.year(+this.key); },

      label({ long = false } = {}) { return this.mode === 'month' ? F.monthLabel(this.key, { long }) : (this.key === CF.data.now.slice(0, 4) ? `${this.key} so far` : this.key); },
      compareLabel() { return this.mode === 'month' ? `vs ${F.monthLabel(F.addMonths(this.key, -1), { year: false })}` : (this.key === CF.data.now.slice(0, 4) ? `vs same months ${+this.key - 1}` : `vs ${+this.key - 1}`); },

  /** ←/→ step periods on laptops (ignored while typing or when a sheet is open). */
  function keys({ left, right }) {
    addEventListener('keydown', (e) => {

  /** "Prototype" ribbon controls shared by all drafts: sample history + theme switch. */
  function devbar({ onSample } = {}) {
    const sampleBtn = h('button.cf-dev-btn', { type: 'button', 'aria-pressed': String(CF.data.sample()) }, 'Sample history');
    sampleBtn.addEventListener('click', () => { CF.data.setSample(!CF.data.sample()); sampleBtn.setAttribute('aria-pressed', String(CF.data.sample())); onSample && onSample(CF.data.sample()); toast(CF.data.sample() ? 'Showing sample history before Oct 2026' : 'Showing only your real Muse data'); });
    const themeBtn = h('button.cf-dev-btn', { type: 'button', 'aria-label': 'Switch light or dark' }, '◐');
    themeBtn.addEventListener('click', () => theme.toggle());
    return h('div.cf-devbar', { role: 'group', 'aria-label': 'Prototype controls' }, h('span.cf-dev-tag', 'Draft'), sampleBtn, themeBtn);
  }

  // Prototype-only: emulate Muse's frame chrome (?hh=52&bp=0) so the picker can test inset handling.
  const qp = new URLSearchParams(location.search);
  if (qp.has('hh')) root.style.setProperty('--header-height', `${+qp.get('hh') || 0}px`);
  if (qp.has('bp')) root.style.setProperty('--bottom-padding', `${+qp.get('bp') || 0}px`);

  theme.init();
  CF.ui = { isPhone, haptic, theme, swipe, swipeRow, pull, sheet, toast, countTo, period, keys, devbar, ACCENTS };
})();

<script>/* ../core/forms.js */
/* Entry sheets: gig sessions, hourly sessions, job days, leave and claims, claim details, income sources
   and the few settings you change in the app. Labels, rates and presets come from the setup
   (CF.data.setup()), never from here. Every save goes through CF.actions. The app restyles .cf-* classes. */
(function () {
  const CF = window.CF, F = CF.fmt, h = CF.h, A = CF.actions, D = CF.data;

  const field = (label, input, hint) => h('label.cf-field', h('span.cf-label', label), input, hint ? h('span.cf-hint', hint) : null);
  const input = (props) => h('input.cf-input', props);
  const money = (cents) => (cents == null ? '' : (cents / 100).toFixed(2));
  const CUR = () => (D.setup() && D.setup().currency) || 'USD';
  const S = (k) => D.stream(k) || D.defaults[k];
  const addMin = (t, n) => { const v = F.toMin(t) + n; return `${F.pad2(Math.floor(v / 60) % 24)}:${F.pad2(v % 60)}`; };
  /** Save a changed copy of the setup (Muse keeps the original's unknown fields). */
  function saveSetup(edit) {
    const raw = D.rawSetup() || { version: 1, streams: {} };
    raw.streams = raw.streams || {};
    edit(raw);
    return A.saveSetup({ setup: raw });
  }
  const toCents = (s) => { const v = Number(String(s).replace(/[^0-9.]/g, '')); return Number.isFinite(v) ? Math.round(v * 100) : NaN; };
  const err = () => h('p.cf-error', { role: 'alert', hidden: true });
  const showErr = (el, msg) => { el.textContent = msg; el.hidden = !msg; };
  function stepper(value, { min = 0, max = 99, step = 1, label, fmt = (v) => v } = {}) {
    let v = value;
    const out = h('output.cf-step-val', { 'aria-live': 'polite' }, fmt(v));
    const set = (n) => { v = F.clamp(n, min, max); out.textContent = fmt(v); wrap.dispatchEvent(new Event('input', { bubbles: true })); CF.ui.haptic(5); };
    const wrap = h('div.cf-stepper', { role: 'group', 'aria-label': label },
      h('button.cf-step', { type: 'button', 'aria-label': `Less ${label}`, onclick: () => set(v - step) }, '−'), out,
      h('button.cf-step', { type: 'button', 'aria-label': `More ${label}`, onclick: () => set(v + step) }, '+'));

  }
  function chips(items, onPick) {
    return h('div.cf-chips', { 'data-noswipe': '' }, items.map((it) => h('button.cf-chip', { type: 'button', onclick: () => { onPick(it); CF.ui.haptic(5); } }, h('strong', it.label), it.sub ? h('span', it.sub) : null)));
  }
  function footer(form, { saveLabel = 'Save', onDelete } = {}) {
    const save = h('button.cf-btn.is-primary', { type: 'submit', form: form.id }, saveLabel);
    return [onDelete ? h('button.cf-btn.is-danger', { type: 'button', onclick: onDelete }, 'Delete') : null, h('span.cf-grow'), save];
  }
  async function run(btn, fn) {
    const b = btn.form ? btn : document.querySelector(`button[form="${btn.id}"]`);
    if (b) { b.disabled = true; b.dataset.label = b.textContent; b.textContent = 'Saving…'; }
    try { return await fn(); } finally { if (b) { b.disabled = false; b.textContent = b.dataset.label; } }
  }
  let formSeq = 0;

  /* ---------------- Gig session (per-session work, claimed monthly) ---------------- */
  function gig({ session, date } = {}) {
    const id = `cf-form-${++formSeq}`, G = S('gig'), len = G.sessionMinutes || 60;
    const s = session || { id: F.uid('gig'), date: date || D.today, venue: D.venues()[0] || '', timeIn: '09:00', timeOut: addMin('09:00', len), sessionsCount: 1, rateCents: D.lastRate('gig'), remarks: '' };
    const fDate = input({ type: 'date', value: s.date, required: true });
    const fVenue = input({ type: 'text', value: s.venue || '', list: `${id}-venues`, autocomplete: 'off', placeholder: 'Optional' });
    const fIn = input({ type: 'time', value: s.timeIn, step: 300, required: true });
    const fOut = input({ type: 'time', value: s.timeOut, step: 300, required: true });
    const fCount = stepper(s.sessionsCount || 1, { min: 1, max: 40, label: 'sessions', fmt: (v) => `${v} × ${len} min` });
    const fRate = input({ type: 'text', inputmode: 'decimal', value: money(s.rateCents), 'aria-label': `Rate per session in ${CUR()}` });
    const fRemarks = input({ type: 'text', value: s.remarks || '', placeholder: 'e.g. Beginner class', maxlength: 120 });
